g loading=\"lazy\" src=\"images/022-1.jpg\" alt=\"Os lacrymal — Mémento p. 47\"><figcaption>Os lacrymal — Mémento p. 47</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 130-132. Images : Mémento Anatomia, Livre III.</p>"], "23": ["Os zygomatique (malaire)", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Os zygomatique, <b>malaire</b> ou <b>jugal</b> : partie supéro-latérale de la face, forme les <b>pommettes</b>, en dehors du maxillaire</li><li>Participe à l’orbite et aux fosses temporale et infra-temporale ; réunit les parties latérales de la face et du crâne et transmet vers la voûte les forces de mastication</li><li>Quadrilatère : <b>2 faces</b> (latérale, médiale), <b>4 bords</b>, <b>4 angles</b></li></ul></div></section><section class=\"sec\"><h3>Face latérale (cutanée)</h3><div><ul><li>Convexe, lisse, sous les téguments des pommettes ; muscles <b>petit zygomatique</b> (en avant) et <b>grand zygomatique</b> (en arrière)</li><li><b>Orifice malaire du canal temporo-malaire</b>, sous le rebord orbitaire (nerf zygomatico-facial) ; parfois double ou absent</li></ul></div></section><section class=\"sec\"><h3>Face médiale</h3><div><ul><li><b>Segment antérieur (articulaire)</b> : rugueux, triangulaire ; <b>suture maxillo-malaire</b> avec le sommet tronqué du processus pyramidal du maxillaire</li><li><b>Segment postérieur (temporal)</b> : lisse, concave ; fosse temporale (en haut), fosse infra-temporale (en bas) ; <b>orifice zygomatico-temporal</b> près du processus frontal (branche temporale du nerf temporo-malaire)</li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Antéro-supérieur (orbitaire)</b> : concave, partie inféro-latérale du rebord orbitaire ; il donne le <b>processus frontal</b> : face médiale concave (parois inférieure et latérale de l’orbite, orifice d’entrée du canal temporo-malaire, <b>tubercule orbitaire de Whitnall</b> à ~1 cm sous la suture fronto-malaire : bandelettes tarses, aponévrose de l’élévateur de la paupière supérieure) ; face latérale (fosse temporale)</li><li>Bord postérieur du processus frontal : <b>suture fronto-malaire</b> (frontal), <b>sphéno-malaire</b> (grande aile), <b>maxillo-malaire</b> ; entre ces deux derniers, un court segment libre = extrémité antérieure de la <b>fissure orbitaire inférieure</b></li><li><b>Postéro-supérieur (temporal)</b> : sinueux, en S italique ; fascia du muscle temporal</li><li><b>Antéro-inférieur (maxillaire)</b> : dentelé, sommet tronqué du processus pyramidal ; élévateur de la lèvre supérieure</li><li><b>Postéro-inférieur (massétérin)</b> : gros ; fibres antérieures du <b>masséter</b></li></ul></div></section><section class=\"sec\"><h3>Angles</h3><div><ul><li><b>Supérieur</b> : dentelé, frontal (suture fronto-malaire) ; <b>antérieur et inférieur</b> : sommet du processus pyramidal (suture maxillo-malaire)</li><li><b>Postérieur</b> (apophyse temporale chez les anglo-saxons) : en biseau, uni à l’apophyse zygomatique du temporal (<b>suture temporo-malaire</b>) → <b>arcade zygomatique</b></li></ul></div></section><section class=\"sec\"><h3>Canal temporo-malaire</h3><div><ul><li>Canal en <b>Y</b> : un orifice unique sur la face médiale du processus frontal, puis 2 canaux (face antéro-externe de l’os ; face temporale du processus frontal près du bord antérieur) ; parfois 2 orifices indépendants</li><li>Traversé par les nerfs <b>zygomatico-facial</b> et <b>zygomatico-temporal</b> (branches terminales du nerf orbitaire, issu du nerf maxillaire)</li></ul></div></section><section class=\"sec\"><h3>Complément — TP 18</h3><div><ul><li>Os quadrilatère aplati de dehors en dedans, en dehors du maxillaire ; les angles inférieur et antérieur répondent à ceux du sommet tronqué du maxillaire ; l’angle postérieur est taillé en biseau et s’unit à l’extrémité antérieure du processus zygomatique</li><li>Même description du canal temporo-malaire en Y (nerf temporo-malaire)</li></ul><div class=\"tip\">Divergence : le TP 18 écrit que l’angle supérieur s’articule avec le « processus zygomatique » (terme tel qu’écrit dans le recueil) ; le Livre Dr. Anca le fait articuler avec le frontal. Anglo-saxons : 3 faces (latérale, postéro-médiale, orbitaire).</div></div></section><div class=\"tip\">Ossification : <b>1 centre</b>, 8e semaine intra-utérine ; l’os est parfois divisé par une suture horizontale en un segment supérieur plus gros et un segment inférieur plus petit.</div><figure><img loading=\"lazy\" src=\"images/023-1.jpg\" alt=\"Os zygomatique — Mémento p. 45\"><figcaption>Os zygomatique — Mémento p. 45</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 132-135. Compléments : Recueil CM/TP Dr. Anca (TP 18, recueil p. 159-160). Images : Mémento Anatomia, Livre III.</p>"], "24": ["Os palatin", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Os <b>pair</b>, en arrière de la cavité nasale, entre le maxillaire et le processus ptérygoïde ; complète en arrière le maxillaire dans la <b>voûte palatine</b>, le plancher nasal, les parois latérales des fosses nasales et un peu le plancher de l’orbite ; participe aux fosses <b>ptérygo-maxillaire</b> et ptérygoïde</li><li>Forme de <b>« L »</b> : <b>lame verticale</b> et <b>lame horizontale</b>, réunies à angle droit ; à leur jonction, le <b>processus pyramidal</b> s’insinue entre les 2 lames du processus ptérygoïde</li></ul></div></section><section class=\"sec\"><h3>Lame horizontale</h3><div><ul><li>Quadrilatère, grand axe transversal, dans le prolongement du processus palatin du maxillaire</li><li><b>Face supérieure</b> : lisse, concave ; tiers postérieur du plancher nasal ; bord interne épais → <b>crête nasale</b> (articulée avec le vomer)</li><li><b>Face inférieure</b> : quart postérieur du palais dur ; rugueuse ; gouttière oblique qui prolonge le <b>canal palatin postérieur</b></li><li><b>Bord externe</b> : jonction avec la lame verticale ; avec le maxillaire, <b>orifice inférieur du canal palatin postérieur</b> (grand canal palatin)</li><li><b>Bord interne</b> : rugueux, articulé avec l’os opposé ; <b>bord antérieur</b> : biseau articulé avec le processus palatin du maxillaire → <b>suture palatine transverse</b>, qui forme avec la suture médiane la <b>suture cruciforme</b></li><li><b>Bord postérieur</b> : concave, tendon du <b>tenseur du voile du palais</b> ; <b>épine nasale postérieure</b> (semi-épines des 2 os) : muscle uvulaire</li></ul></div></section><section class=\"sec\"><h3>Lame verticale : faces</h3><div><ul><li>Quadrilatère, plus haute que large, aplatie transversalement</li><li><b>Face interne</b> (paroi externe des fosses nasales) : <b>crête ethmoïdale</b> (turbinale supérieure ; cornet moyen ; orifice sphéno-palatin juste en dessous) et <b>crête conchale</b> (turbinale inférieure ; cornet inférieur) ; entre elles, méat moyen, au-dessous, méat inférieur</li><li><b>Face externe</b>, 4 segments d’avant en arrière : <b>sinusien</b> (lisse, dépasse le bord postérieur de l’orifice du sinus maxillaire) ; <b>maxillaire</b> (rugueux, 2 zones séparées par la <b>gouttière palatine postérieure</b> qui forme le canal palatin postérieur) ; <b>inter-ptérygo-maxillaire</b> (lisse, moitié supérieure : fond de la fosse infra-temporale) ; <b>ptérygoïdien</b> (rugueux, aile interne du processus ptérygoïde)</li></ul></div></section><section class=\"sec\"><h3>Lame verticale : bords</h3><div><ul><li><b>Antérieur</b> : oblique, croise l’orifice du sinus maxillaire ; <b>processus maxillaire</b> du palatin (articulé avec le cornet inférieur)</li><li><b>Postérieur</b> : très mince, appliqué sur l’aile interne du processus ptérygoïde (suture dentelée) ; <b>inférieur</b> : confondu avec le bord latéral de la lame horizontale</li><li><b>Supérieur</b> : 2 processus, <b>orbitaire</b> (antérieur) et <b>sphénoïdal</b> (postérieur), séparés par l’<b>incisure sphéno-palatine</b>, transformée par le sphénoïde en <b>canal sphéno-palatin</b> (fosse ptérygo-maxillaire → méat supérieur) : artère et nerf sphéno-palatins</li></ul></div></section><section class=\"sec\"><h3>Processus orbitaire, sphénoïdal, pyramidal</h3><div><ul><li><b>Orbitaire</b> : pyramide triangulaire sur un pédicule (« cou ») ; 3 facettes : palatine (maxillaire), ethmoïdale (masses latérales), sphénoïdale (corps du sphénoïde) ; <b>sinus du processus orbitaire</b> en rapport avec le sinus maxillaire, une cellule ethmoïdale et le sinus sphénoïdal ; surface libre « en dos d’âne » : plancher de l’orbite et fond de la fosse infra-temporale ; limite la partie postérieure de la <b>fente sphéno-maxillaire</b></li><li><b>Sphénoïdal</b> : lamelle quadrilatère (haut, dedans, derrière) ; face inféro-médiale = paroi supérieure des fosses nasales ; face supéro-latérale + processus vaginal = <b>canal ptérygo-palatin</b> (artère ptérygo-palatine, nerf pharyngien de Bock)</li><li><b>Pyramidal</b> : détaché de la jonction des 2 lames, comble l’espace entre les 2 lames du processus ptérygoïde ; face postérieure (fond de la fosse ptérygoïde), face antérieure (tubérosité maxillaire ; fibres du ptérygoïdien interne), face inférieure (orifices palatins accessoires : nerfs palatins moyen et postérieur)</li></ul></div></section><div class=\"tip\">Ossification : <b>1 centre</b> par os, dans la lame verticale, à la <b>8e semaine</b> intra-utérine.</div><figure><img loading=\"lazy\" src=\"images/024-1.jpg\" alt=\"Os palatin, vues médiale et latérale — Mémento p. 43\"><figcaption>Os palatin, vues médiale et latérale — Mémento p. 43</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 136-142. Images : Mémento Anatomia, Livre III.</p>"], "25": ["Os nasaux & cornets nasaux inférieurs", "<section class=\"sec\"><h3>Cornet nasal inférieur : généralités</h3><div><ul><li>Lame osseuse <b>enroulée sur elle-même</b>, triangulaire (sommet postérieur), fixée à la paroi latérale de la fosse nasale par son bord supérieur, libre dans la fosse ; ou cornet maxillaire</li><li><b>2 faces</b>, <b>2 bords</b>, <b>2 extrémités</b></li></ul></div></section><section class=\"sec\"><h3>Faces et bords</h3><div><ul><li><b>Face médiale</b> : convexe vers le septum, orifices et gouttières vasculaires ; lisse en haut, rugueuse et perforée en bas (corps érectiles, glandes), séparées par une crête ou une gouttière vasculaire</li><li><b>Face latérale</b> : concave ; délimite le <b>méat inférieur</b>, où s’ouvre le canal lacrymo-nasal ; sa paroi externe (sinus maxillaire) est le lieu de la <b>ponction du sinus</b></li><li><b>Bord inférieur</b> : libre, gros, spongieux ; la muqueuse s’y réfléchit</li><li><b>Bord supérieur</b> (articulaire), d’avant en arrière : partie antérieure (crête conchale du maxillaire) ; <b>processus lacrymal</b> (partie inférieure du canal lacrymo-nasal, avec le lacrymal et le maxillaire) ; <b>processus maxillaire (auriculaire)</b> (triangulaire, couvre l’orifice du sinus sous le bord supérieur, s’unit au processus maxillaire du palatin) ; <b>processus ethmoïdal</b> (articulé avec l’apophyse unciforme, souvent plusieurs) ; partie rugueuse articulée avec la crête conchale du palatin</li></ul></div></section><section class=\"sec\"><h3>Extrémités</h3><div><ul><li><b>Antérieure (tête)</b> : plus volumineuse, jusqu’à 2 cm de l’orifice des narines</li><li><b>Postérieure (queue)</b> : plus mince, à 1 cm de l’orifice pharyngien de la trompe d’Eustache, qu’elle peut obstruer en cas d’hypertrophie (troubles de ventilation otique et respiratoire)</li></ul></div></section><div class=\"tip\">Ossification du cornet inférieur : <b>1 centre</b>, 5e mois intra-utérin.</div><section class=\"sec\"><h3>Os nasaux (os propres du nez)</h3><div><ul><li>De part et d’autre de la ligne médiane, entre les processus frontaux des maxillaires, sous la région glabellaire du frontal ; peu développés chez l’homme ; quadrilatères, aplatis d’avant en arrière, <b>plus larges et plus minces en bas</b> ; <b>2 faces, 4 bords</b></li><li><b>Face antérieure (cutanée)</b> : convexe transversalement, concave verticalement ; muscle pyramidal du nez ; recouverte par le procerus et le nasalis ; petit orifice veineux dans le tiers supérieur</li><li><b>Face postérieure (nasale)</b> : concave ; <b>gouttière ethmoïdale</b> (rameaux nasaux latéraux du nerf ethmoïdal antérieur) ; aspérités pour l’épine nasale du frontal</li><li><b>Supérieur</b> : dentelé, frontal → <b>suture fronto-nasale</b> ; <b>nasion</b> sur la ligne médiane</li><li><b>Inférieur</b> : mince, cartilage latéral du nez ; <b>incisure</b> à la fin de la gouttière ethmoïdale</li><li><b>Latéral</b> : biseau, processus frontal du maxillaire → <b>suture naso-maxillaire</b> ; <b>interne</b> : irrégulier, os opposé ; petite crête sagittale articulée avec l’épine nasale du frontal, la lame perpendiculaire de l’ethmoïde et le cartilage du septum</li></ul></div></section><div class=\"tip\">Ossification de l’os nasal : <b>1 centre</b>, début du 3e mois intra-utérin.</div><figure><img loading=\"lazy\" src=\"images/025-1.jpg\" alt=\"Cornet nasal inférieur droit (vue latérale) — Mémento p. 46\"><figcaption>Cornet nasal inférieur droit (vue latérale) — Mémento p. 46</figcaption></figure><figure><img loading=\"lazy\" src=\"images/025-2.jpg\" alt=\"Os nasal, faces antérieure et postérieure — Mémento p. 49\"><figcaption>Os nasal, faces antérieure et postérieure — Mémento p. 49</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 142-146. Images : Mémento Anatomia, Livre III.</p>"], "26": ["Vomer", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Seul os <b>impair</b> de la mâchoire supérieure ; lame verticale trapézoïdale, médiane, aplatie transversalement, en « soc de charrue », dans la partie <b>postéro-inférieure du septum nasal</b> ; oblique en bas et en avant, du corps du sphénoïde au plancher des fosses nasales</li><li>Formé de 2 lames primitives (droite et gauche) qui se soudent ; <b>2 faces, 4 bords</b></li></ul></div></section><section class=\"sec\"><h3>Faces</h3><div><ul><li>Latérales, planes en général (déviations possibles : une face convexe, l’autre concave) ; gouttières vasculo-nerveuses ; la plus marquée est oblique le long du bord antérieur : <b>nerf sphéno-palatin interne de Hirschfeld</b> (branche du nerf maxillaire)</li><li>Couvertes par la muqueuse pituitaire</li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Supérieur</b> (le plus gros) : divisé en 2 lamelles, les <b>ailes du vomer</b>, séparées par une gouttière qui correspond à la crête médiane de la face inférieure du sphénoïde = <b>schyndilèse sphéno-vomérienne</b> ; avec la crête sphénoïdale : <b>canal sphéno-vomérien médian</b> ; le bord des ailes arrive à la fissure fermée en <b>canal ptérygo-palatin</b> (nerf pharyngien de Bock)</li><li><b>Antérieur (antéro-supérieur)</b> : le plus long, oblique en bas et en avant, 2 lamelles séparées par une gouttière : en haut, bord postérieur de la lame perpendiculaire de l’ethmoïde ; en bas, cartilage de la cloison</li><li><b>Postérieur (postéro-inférieur)</b> : mince, libre, concave ; bord postérieur de la cloison, <b>sépare les 2 choanes</b></li><li><b>Inférieur</b> : mince mais rugueux, horizontal ; processus palatin du maxillaire (sans toucher l’épine nasale antérieure) et lame horizontale du palatin</li><li><b>Extrémité antérieure</b> : bord postérieur de la crête incisive du maxillaire, entre les canaux incisifs</li></ul></div></section><div class=\"tip\">Ossification : le septum nasal est d’abord une plaque cartilagineuse, ossifiée en haut (lame perpendiculaire de l’ethmoïde) ; le vomer se forme dans le tissu sous-muqueux de ses faces latérales. <b>2 centres</b> (droit, gauche) à la <b>8e semaine</b>, dans la partie inférieure et moyenne du septum ; ils se réunissent à partir du 3e mois ; à la puberté, presque unis, l’origine bilaminaire reste visible (ailes du vomer, gouttière du bord antérieur).</div><figure><img loading=\"lazy\" src=\"images/026-1.jpg\" alt=\"Vomer, vue latérale (face droite) — Mémento p. 48\"><figcaption>Vomer, vue latérale (face droite) — Mémento p. 48</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 147-148. Images : Mémento Anatomia, Livre III.</p>"], "27": ["Mandibule · le corps", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Os <b>impair, médian et symétrique</b> ; avec le maxillaire, le palatin et l’hyoïde, squelette de la cavité initiale du tube digestif ; <b>plus gros os de la face</b></li><li>Un <b>corps</b> horizontal en fer à cheval (concavité en arrière) et <b>2 branches</b> verticales ; le corps a <b>2 faces</b> (antérieure, postérieure) et <b>2 bords</b> (supérieur, inférieur)</li></ul></div></section><section class=\"sec\"><h3>Face antérieure</h3><div><ul><li>Convexe ; sur la ligne médiane, la <b>symphyse mentonnière</b> (union des 2 moitiés) se termine en bas sur la <b>protubérance mentonnière</b> (triangulaire, base inférieure) ; moitié supérieure = partie alvéolaire, avec les <b>bosses alvéolaires</b> (incisives, <b>bosse canine</b>)</li><li><b>Ligne oblique externe</b> : monte vers le bord antérieur de la branche ; insertion du <b>carré du menton</b> (abaisseur de la lèvre inférieure), du <b>triangulaire des lèvres</b> et du <b>platysma</b> ; sa partie postérieure forme la lèvre inférieure d’une gouttière du <b>buccinateur</b></li><li><b>Trou mentonnier</b> (1-2 mm), au-dessus de la ligne oblique, sur une verticale entre les 2 prémolaires, à égale distance des 2 bords, ouvert en haut et en arrière : artère mentonnière (branche de l’alvéolaire inférieure) et nerf mentonnier (branche du nerf alvéolaire inférieur)</li></ul></div></section><section class=\"sec\"><h3>Face postérieure</h3><div><ul><li><b>Tubercules (épines) géniens</b> : 4, près de la ligne médiane et du bord inférieur ; les supérieurs = <b>génio-glosses</b>, les inférieurs = <b>génio-hyoïdiens</b> (parfois fusionnés) ; au-dessus, gouttière médiane (repère radiologique)</li><li><b>Ligne mylo-hyoïdienne</b> (oblique interne) : des tubercules géniens à la 3e molaire ; insertion du <b>mylo-hyoïdien</b> (plancher buccal) ; divise la face en partie buccale (haut) et cervicale (bas) ; en dessous, <b>gouttière mylo-hyoïdienne</b> (vaisseaux et nerf mylo-hyoïdiens)</li><li>Au-dessus de la ligne : <b>fossette sublinguale</b> (glande sublinguale) ; au-dessous : <b>fossette sous-mandibulaire</b> (glande sous-maxillaire)</li></ul></div></section><section class=\"sec\"><h3>Bord supérieur (alvéolaire)</h3><div><ul><li>Presque la moitié de la hauteur du corps ; alvéoles dentaires séparées par des septums inter-alvéolaires ; canalicule vasculaire entre incisives centrale et latérale</li><li>Alvéoles : incisives (plates, épine inter-dentaire sur la ligne médiane) ; <b>canine</b> (profonde, large, ovale) ; prémolaires (2e un peu plus large) ; <b>1re molaire</b> : 2 logettes (mésiale réniforme, distale ovale) séparées par un septum inter-radiculaire ; 2e molaire : 2 logettes, parfois compartiment périphérique ; <b>dent de sagesse</b> : contour irrégulier, plus étroit en distal</li><li>Le bord supérieur est plus long à droite qu’à gauche (en moyenne 2 mm, jusqu’à 6 mm) : moins d’espace à gauche, d’où des anomalies de la dent de sagesse plus fréquentes à gauche</li></ul></div></section><section class=\"sec\"><h3>Bord inférieur</h3><div><ul><li>Lisse ; de part et d’autre de la ligne médiane : <b>fossette digastrique</b> (ventre antérieur du digastrique) ; plus en dehors, à la limite avec la branche, gouttière de l’<b>artère faciale</b></li><li>Hauteur du corps maximale aux incisives et canines, décroissante vers les molaires ; bord concave au niveau des fossettes digastriques, légèrement convexe en latéral (profil sinueux)</li></ul></div></section><section class=\"sec\"><h3>Complément — TP 17</h3><div><ul><li>Foramen mentonnier à égale distance des 2 bords, sur une verticale passant <b>tantôt entre les 2 prémolaires, tantôt par l’une ou l’autre</b></li><li>Épines mentonnières inférieures, parfois les 4 processus, fusionnées en une seule</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/027-1.jpg\" alt=\"Mandibule, vues latérale, antéro-supérieure et médiale — Mémento p. 41\"><figcaption>Mandibule, vues latérale, antéro-supérieure et médiale — Mémento p. 41</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 149-154. Compléments : Recueil CM/TP Dr. Anca (TP 17, recueil p. 150-151). Images : Mémento Anatomia, Livre III.</p>"], "28": ["Mandibule · les branches", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Quadrilatères, allongées de haut en bas ; <b>2 faces</b> et <b>4 bords</b></li></ul></div></section><section class=\"sec\"><h3>Faces</h3><div><ul><li><b>Latérale</b> : <b>empreinte massétérine</b> (plus profonde en haut, limitée en avant et en bas par la gouttière de l’artère faciale) ; 2-3 crêtes rugueuses obliques (crêtes inter-fasciculaires du masséter)</li><li><b>Médiale</b> : <b>orifice supérieur du canal dentaire (mandibulaire)</b> au milieu d’une ligne tragus – angle antéro-inférieur du masséter ; limité en avant et en dedans par l’<b>épine de Spix (lingula)</b> (ligament sphéno-mandibulaire) ; derrière : <b>antilingula</b> inconstante ; entre les 2 commence la gouttière mylo-hyoïdienne</li><li><b>Canal mandibulaire</b> (courbe à concavité antéro-supérieure) : paquet vasculo-nerveux alvéolaire inférieur ; selon les anglo-saxons, il se divise sous les prémolaires en canal mentonnier et canal incisif ; chez le fœtus, <b>canal de Serres</b> (sans vaisseaux, s’oblitère)</li><li>Entre la lingula et les crêtes du ptérygoïdien interne : <b>nerf lingual</b> ; <b>empreinte du ptérygoïdien interne</b> sous l’orifice, avec crêtes inter-fasciculaires près du gonion</li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Inférieur</b> : prolonge celui du corps, plus mince</li><li><b>Postérieur (parotidien)</b> : gros, lisse, en S italique, rapport avec la parotide ; avec le bord inférieur il forme l’<b>angle de la mandibule</b> (110-120°), sommet = <b>gonion</b> (point craniométrique)</li><li><b>Antérieur</b> : mince, se divise en 2 crêtes (médiale, latérale) où s’insère le <b>temporal</b> ; entre elles, le <b>trigone rétro-molaire</b> ; sur la lèvre externe, le <b>canal buccinateur</b> ; la crête médiale monte sur la face médiale de l’apophyse coronoïde : <b>crête temporale</b> (Hovelaque)</li><li><b>Supérieur</b> : apophyse coronoïde (devant), condyle (derrière), séparés par l’<b>incisure mandibulaire (sigmoïde)</b> : paquet vasculo-nerveux massétérin (artère massétérine, nerf temporo-massétérin) ; relie les régions massétérine et zygomatique</li></ul></div></section><section class=\"sec\"><h3>Apophyse coronoïde et condyle</h3><div><ul><li><b>Coronoïde</b> : triangulaire, pointue, en haut et en avant ; face latérale lisse (masséter), face interne avec la crête temporale ; insertion du <b>temporal</b> ; palpable sous le zygoma</li><li><b>Condyle</b> : tête ellipsoïde, transversale, dans l’angle postéro-supérieur, articulée avec la cavité glénoïde du temporal ; axe long ~20 mm, antéro-postérieur 7-10 mm ; les grands axes se rencontrent devant le trou occipital (angle ~146°) ; <b>2 versants</b> (antérieur et postérieur) séparés par une surface « en dos d’âne » ; rugosité sous l’extrémité latérale : ligament latéral de l’ATM</li><li><b>Col du condyle</b> : <b>fossette ptérygoïdienne</b> (ptérygoïdien externe) ; <b>pilier médial</b> ; rapports : nerf auriculo-temporal, artère maxillaire interne (après la <b>boutonnière rétro-condylienne de Juvara</b>)</li></ul></div></section><div class=\"tip\">Ossification : 1 centre par moitié, près du trou mentonnier, à la <b>6e semaine</b> intra-utérine ; origine dans l’<b>arc branchial I</b> (cartilage de Meckel). À la naissance, symphyse fibreuse ; les 2 moitiés se réunissent de bas en haut de la 1re à la 3e année.</div><section class=\"sec\"><h3>Complément — TP 17</h3><div><ul><li>Branches rectangulaires ; gouttière du bord antérieur avec la <b>crête buccinatrice</b> (oblique en bas et en dehors) : insertion du buccinateur</li><li>Bord inférieur souvent creusé en avant d’une dépression transversale (artère faciale)</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/027-1.jpg\" alt=\"Mandibule, vues latérale, antéro-supérieure et médiale — Mémento p. 41\"><figcaption>Mandibule, vues latérale, antéro-supérieure et médiale — Mémento p. 41</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 154-162. Compléments : Recueil CM/TP Dr. Anca (TP 17, recueil p. 151-152). Images : Mémento Anatomia, Livre III.</p>"], "29": ["L’orbite · parois interne et inférieure", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>2 cavités profondes en <b>pyramide quadrangulaire</b> : base antérieure (rebord orbitaire), sommet postérieur au <b>trou optique</b> ; entre massif facial et crâne, en dehors des fosses nasales, au-dessus du maxillaire, sous la base du crâne ; abritent le globe oculaire et ses annexes</li><li>Séparées des fosses nasales par les masses latérales de l’ethmoïde et les os lacrymaux ; <b>axes</b> obliques en arrière et en dedans, se rencontrant au-dessus de la lame quadrilatère du sphénoïde (angle 40-45°)</li><li><b>4 parois</b> (supérieure, inférieure, interne, externe), 4 bords, un sommet, une base</li></ul></div></section><section class=\"sec\"><h3>Paroi inférieure (plancher)</h3><div><ul><li>Concave, très mince ; <b>plafond du sinus maxillaire</b> ; séparée de la paroi externe, en arrière, par la <b>fissure orbitaire inférieure (fente sphéno-maxillaire)</b> : nerf maxillaire et artère sous-orbitaire ; relie l’orbite à la fosse ptérygo-palatine</li><li>Fissure limitée en haut par la grande aile, en bas par le maxillaire et le processus orbitaire du palatin, en dehors par le zygomatique</li><li><b>3 os</b> : face supérieure du <b>processus pyramidal du maxillaire</b> (2/3 internes), <b>processus frontal du zygomatique</b> (antéro-latéral), <b>processus orbitaire du palatin</b> (en arrière) ; sutures maxillo-malaire et maxillo-palatine</li><li><b>Gouttière puis canal sous-orbitaire</b> (nerf maxillaire, artère sous-orbitaire) ; le canal fait saillie dans le sinus maxillaire, parfois déhiscent : <b>névralgies du trijumeau dans les sinusites</b> ; trou infra-orbitaire parfois double</li></ul></div></section><section class=\"sec\"><h3>Paroi interne</h3><div><ul><li>Presque parallèle au plan médian, <b>très mince</b> sauf en arrière</li><li>D’avant en arrière : <b>processus frontal du maxillaire</b>, <b>face externe du lacrymal</b>, <b>os planum de l’ethmoïde</b>, segment de la face externe du <b>corps du sphénoïde</b> ; sutures lacrymo-maxillaire, lacrymo-ethmoïdale, sphéno-ethmoïdale</li><li>Séparée du plafond par les sutures fronto-maxillaire, fronto-lacrymale, fronto-ethmoïdale ; du plancher par les sutures maxillo-lacrymale, maxillo-ethmoïdale, ethmoïdo-palatine</li><li><b>Gouttière lacrymale</b> (devant, derrière le processus frontal du maxillaire) → <b>canal lacrymo-nasal</b>, oblique en bas, en dehors et en arrière ; crête antérieure : tendon direct de l’orbiculaire, crête postérieure : tendon réfléchi ; muscle de <b>Horner</b> ; <b>crochet lacrymal</b> complète l’orifice supérieur</li><li><b>Os planum</b> : paroi latérale du labyrinthe ethmoïdal ; suture fronto-ethmoïdale → cellules fronto-ethmoïdales ; <b>canaux ethmoïdaux antérieur</b> (artère et nerf ethmoïdaux antérieurs, nerf nasal interne) et <b>postérieur</b> (artère ethmoïdale postérieure, nerf sphéno-ethmoïdal de Luschka ; peut manquer) ; en arrière, rapport avec le sinus sphénoïdal</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/029-1.jpg\" alt=\"Orbite et insertions musculaires — Mémento p. 51\"><figcaption>Orbite et insertions musculaires — Mémento p. 51</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 164-168. Images : Mémento Anatomia, Livre III.</p>"], "30": ["L’orbite · parois externe et supérieure", "<section class=\"sec\"><h3>Paroi supérieure (plafond)</h3><div><ul><li>Concave, surtout en avant ; <b>fosse orbitaire du frontal</b> (très mince) devant, <b>face inférieure de la petite aile du sphénoïde</b> derrière (suture presque horizontale) ; rapport avec le lobe frontal</li><li><b>Fossette trochléaire</b> (antéro-interne, souvent peu marquée) : poulie fibro-cartilagineuse du grand oblique ; <b>fossette lacrymale</b> (antéro-externe, plus profonde) : partie orbitaire de la glande lacrymale</li></ul></div></section><section class=\"sec\"><h3>Paroi externe</h3><div><ul><li>La <b>plus épaisse</b> ; plane ; épaisse en arrière (sépare l’orbite de l’étage moyen), mince en avant (fosse temporale)</li><li>Formée aux <b>2/3 postérieurs</b> par la face orbitaire de la grande aile du sphénoïde, complétée par le <b>processus frontal du zygomatique</b> et le <b>processus orbitaire externe du frontal</b> ; sutures sphéno-zygomatique, sphéno-frontale, fronto-malaire</li><li>2 petits orifices sur le processus frontal du zygomatique : nerfs <b>zygomatico-facial</b> (près de la jonction avec le plancher) et <b>zygomatico-temporal</b> (plus haut, près de la suture sphéno-zygomatique)</li><li>Séparée du plafond, en arrière, par la <b>fissure orbitaire supérieure</b> (fente sphénoïdale)</li></ul></div></section><section class=\"sec\"><h3>Bords (angles) de l’orbite</h3><div><ul><li><b>Supéro-externe</b> : fossette lacrymale (devant), suture fronto-sphénoïdale et queue de la fissure orbitaire supérieure (derrière)</li><li><b>Supéro-interne</b> : suture frontale/processus frontal du maxillaire, fronto-lacrymale, fronto-ethmoïdale (canaux ethmoïdaux)</li><li><b>Inféro-interne</b> (angle obtus) : de l’orifice supérieur du canal lacrymo-nasal jusqu’à la suture du corps du sphénoïde et du processus orbitaire du palatin (sutures lacrymo-maxillaire, ethmoïdo-maxillaire)</li><li><b>Inféro-externe</b> : face supérieure du processus orbitaire du malaire (devant), fissure orbitaire inférieure (derrière)</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/029-1.jpg\" alt=\"Orbite et insertions musculaires — Mémento p. 51\"><figcaption>Orbite et insertions musculaires — Mémento p. 51</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 163-164, 166, 168-169. Images : Mémento Anatomia, Livre III.</p>"], "31": ["L’orbite · rebord et communications", "<section class=\"sec\"><h3>Sommet</h3><div><ul><li><b>Canal optique</b> (interne, rond) : nerf optique (interne) et artère ophtalmique (externe) ; <b>fissure orbitaire supérieure</b> (externe, en virgule, tête interne) : nerfs <b>oculomoteur, trochléaire, abducens</b>, branches nasale, frontale et lacrymale de l’ophtalmique, veines ophtalmiques et un rameau de l’artère méningée moyenne</li><li>Sur le sommet : <b>anneau tendineux de Zinn</b> (tous les muscles extrinsèques sauf l’oblique inférieur) ; petit tubercule osseux sur le bord interne de la fissure</li><li><b>Dans l’anneau</b> : oculomoteur, abducens, nerf nasal ; <b>en dehors</b> : trochléaire, frontal, lacrymal, veines ophtalmiques ; gouttière infra-orbitaire de Royle (1/3 des orbites), anastomose possible entre artère méningée moyenne et artère sous-orbitaire</li></ul></div></section><section class=\"sec\"><h3>Base (rebord orbitaire)</h3><div><ul><li>Quadrilatère aux angles arrondis ; <b>supérieur</b> : arcade sourcilière du frontal (concavité en bas) avec, à l’union du tiers interne et des 2/3 externes, le <b>canal supra-orbitaire</b> (nerf frontal externe et vaisseaux) ; 1 cm en dedans, gouttière du nerf frontal interne ; extrémités : processus orbitaires <b>interne</b> (lacrymal, processus frontal du maxillaire) et <b>externe</b> (os malaire)</li><li><b>Inférieur</b> : processus pyramidal du maxillaire + os malaire ; <b>externe</b> : os malaire ; <b>interne</b> : processus frontal du maxillaire</li><li>La base regarde en avant et en dehors : les plans des 2 bases forment un angle obtus ouvert en arrière (~131° chez les Européens)</li></ul></div></section><section class=\"sec\"><h3>Communications</h3><div><ul><li><b>Étage antérieur de la base du crâne</b> : trou optique, fissure orbitaire supérieure, canaux ethmoïdaux antérieur et postérieur</li><li><b>Fosses nasales</b> : canal lacrymo-nasal (méat inférieur)</li><li><b>Fosse ptérygo-maxillaire</b> : fissure orbitaire inférieure</li><li><b>Extérieur</b> : trou supra-orbitaire et canal malaire (nerf temporo-malaire)</li></ul></div></section><section class=\"sec\"><h3>Indices orbitaires</h3><div><ul><li><b>Largeur</b> : du dacryon au point où le bord externe croise l’axe transversal, 32-44 mm ; <b>hauteur</b> : 26-48 mm ; orbites féminines plus hautes et plus étroites</li><li><b>Indice orbitaire</b> = hauteur × 100 / largeur (toujours < 100 chez l’adulte) : <b>mégasème</b> > 89 ; <b>mésosème</b> 83-88,9 ; <b>microsème</b> < 83 (Broca)</li><li><b>Indice céphalo-orbitaire</b> : capacité des 2 orbites / capacité crânienne × 100 ≈ 27,2 (22,7-36,5) ; chaque orbite ≈ 1/8 de la capacité crânienne</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/029-1.jpg\" alt=\"Orbite et insertions musculaires — Mémento p. 51\"><figcaption>Orbite et insertions musculaires — Mémento p. 51</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 169-172. Images : Mémento Anatomia, Livre III.</p>"], "32": ["Les fosses nasales · parois supérieure, interne et inférieure", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>2 cavités anfractueuses au centre de la face, au-dessus de la cavité buccale, sous la base du crâne, séparées par un <b>septum vertical</b> ; couloir aplati transversalement : <b>4 parois et 2 ouvertures</b> ; muqueuse pituitaire (récepteurs olfactifs)</li></ul></div></section><section class=\"sec\"><h3>Paroi inférieure (plancher)</h3><div><ul><li>Inclinée d’avant en arrière et de haut en bas ; plane, légèrement concave transversalement ; <b>processus palatin du maxillaire</b> (devant) + <b>lame horizontale du palatin</b> (derrière), suture transversale ; étroit aux orifices, dilaté au milieu ; <b>orifice supérieur du canal incisif</b> devant ; l’une des parois les plus épaisses et résistantes</li></ul></div></section><section class=\"sec\"><h3>Paroi supérieure (plafond)</h3><div><ul><li>Gouttière étroite très courbe (concavité en bas), 4 segments d’avant en arrière :</li><li>1. face postérieure des <b>os nasaux</b> + épine nasale du frontal (oblique en haut et en arrière)</li><li>2. <b>lame criblée de l’ethmoïde</b> (segment le plus important, rapport avec l’endocrâne) : 25-30 orifices du nerf olfactif sur 3 rangées ; en avant : <b>fente ethmoïdale</b> (interne, prolongement de la dure-mère) et <b>trou ethmoïdal antérieur</b> (externe : nerf nasal interne + artère ethmoïdale antérieure)</li><li>3. <b>face antérieure du corps du sphénoïde</b> (presque verticale) avec l’orifice du sinus sphénoïdal</li><li>4. <b>face inférieure du corps du sphénoïde</b>, couverte par les ailes du vomer et le processus sphénoïdal du palatin</li><li>Tout en arrière : <b>conduit ptérygo-palatin</b> (artère et nerf ptérygo-palatins, nerf pharyngien de Bock) → fosse ptérygo-maxillaire</li></ul></div></section><section class=\"sec\"><h3>Paroi interne (septum osseux)</h3><div><ul><li>Lame osseuse mince : <b>lame verticale (perpendiculaire) de l’ethmoïde</b> en haut et en avant, <b>vomer</b> en bas et en arrière (suture ethmoïdo-vomérienne) ; le <b>bec</b> et la crête du sphénoïde la prolongent</li><li>Ethmoïde et vomer forment un angle ouvert en avant, complété par le <b>cartilage de la cloison</b> ; la cloison peut dévier, surtout au niveau de la suture ethmoïdo-vomérienne</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/032-1.jpg\" alt=\"Fosses nasales : septum, choanes et parois — Mémento p. 55\"><figcaption>Fosses nasales : septum, choanes et parois — Mémento p. 55</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 173-177. Images : Mémento Anatomia, Livre III.</p>"], "33": ["Les fosses nasales · paroi externe et communications", "<section class=\"sec\"><h3>Paroi externe</h3><div><ul><li>Du plancher au plafond, inclinée de haut en bas et de dedans en dehors ; <b>6 os</b> : maxillaire, lacrymal, ethmoïde, sphénoïde, lame verticale du palatin, cornet inférieur ; l’artère maxillaire participe par son segment supra-palatin ; l’aile interne du processus ptérygoïde forme la partie la plus postérieure et le bord externe des choanes</li><li>3 plans osseux jamais complets : face interne du maxillaire et lame interne de la ptérygoïde ; face interne du lacrymal et lame verticale du palatin ; cornet inférieur et masses latérales de l’ethmoïde</li></ul></div></section><section class=\"sec\"><h3>Les 3 cornets et méats</h3><div><ul><li><b>Cornet supérieur (Morgagni)</b> : ~25 × 3-4 mm (ethmoïde) ; <b>méat supérieur</b> court (cellules ethmoïdales postérieures), <b>trou sphéno-palatin</b> à son extrémité postérieure ; parfois <b>cornet de Santorini</b> (6-7 mm) et méat accessoire</li><li><b>Cornet moyen</b> : triangulaire, ~45 × 10 mm ; face interne : <b>fente olfactive</b> ; tête = <i>operculum</i> (parfois <i>concha bullosa</i>) ; queue à 1 cm de l’orifice de la trompe d’Eustache ; <b>méat moyen</b> : <b>apophyse unciforme</b> (traverse l’orifice du sinus maxillaire) et <b>bulle ethmoïdale</b>, séparées par la <b>gouttière unciforme (hiatus semi-lunaire, ~20 mm)</b> : sinus frontal et cellules antérieures (antéro-supérieur), sinus maxillaire (postéro-inférieur) ; <b>gouttière rétrobulbaire</b> (10-12 mm) : cellules antérieures</li><li><b>Cornet inférieur</b> (os du viscérocrâne) : <b>méat inférieur</b>, le plus grand, où s’ouvre le canal lacrymo-nasal ; ponction du sinus maxillaire ; tête à 2 cm des narines, queue à 1 cm de la trompe</li></ul></div></section><section class=\"sec\"><h3>Ouvertures</h3><div><ul><li><b>Antérieure (ouverture piriforme)</b> : 2 maxillaires + os nasaux ; en cœur de carte à jouer, base en bas, <b>épine nasale antérieure</b> au milieu</li><li><b>Postérieure (choane)</b> : quadrilatère plus haut que large (hauteur = 2 × largeur), plus étroit en haut ; en haut face inférieure du corps du sphénoïde + aile du vomer ; en bas bord postérieur de la lame horizontale du palatin ; en dehors face interne du processus ptérygoïde ; en dedans bord postérieur du vomer</li></ul></div></section><section class=\"sec\"><h3>Communications</h3><div><ul><li>Extérieur (narines) ; <b>rhinopharynx</b> (choanes) ; <b>orbite</b> (canal lacrymo-nasal) ; <b>crâne</b> (lame criblée) ; <b>cavité buccale</b> (canal palatin antérieur) ; <b>fosse ptérygo-maxillaire</b> (canal sphéno-palatin et conduit ptérygo-palatin)</li></ul></div></section><section class=\"sec\"><h3>Indices nasaux</h3><div><ul><li>Hauteur : nasion – point spinal ; largeur : maximale de l’ouverture piriforme ; <b>indice nasal</b> = largeur × 100 / hauteur : <b>leptorhinien</b> < 46,9 ; <b>mésorhinien</b> 47-50 ; <b>platyrhinien</b> 51-57,9 ; <b>hyperchamérhinien</b> > 58</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/032-1.jpg\" alt=\"Fosses nasales : septum, choanes et parois — Mémento p. 55\"><figcaption>Fosses nasales : septum, choanes et parois — Mémento p. 55</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 177-183. Images : Mémento Anatomia, Livre III.</p>"], "34": ["La fosse infra-temporale · parois", "<section class=\"sec\"><h3>Fosse zygomatique (Testut)</h3><div><ul><li>Espace large, mal délimité, sous l’arcade zygomatique, entre le processus ptérygoïde et la face interne de la branche de la mandibule ; sans paroi postérieure ni inférieure</li><li><b>Supérieure</b> : surface rugueuse entre la base du ptérygoïde et la <b>crête sphéno-temporale</b> ; <b>externe</b> : face interne du malaire et de la branche mandibulaire ; <b>antérieure</b> : face postérieure du processus pyramidal du maxillaire ; <b>interne</b> : lame externe du ptérygoïde (devant elle, la fente vers la fosse ptérygo-maxillaire)</li></ul></div></section><section class=\"sec\"><h3>Fosse infra-temporale (auteurs français)</h3><div><ul><li>Large excavation derrière le maxillaire, sous la crête sphéno-temporale, en dehors du processus ptérygoïde ; <b>pyramide triangulaire</b></li><li><b>Antérieure</b> : tubérosité maxillaire ; <b>supérieure</b> : face externe de la grande aile sous la crête sphéno-temporale ; <b>interne</b> : lame externe du ptérygoïde ; sommet : extrémité supérieure du ptérygoïde ; base ouverte en dehors</li></ul></div></section><section class=\"sec\"><h3>Anglo-saxons</h3><div><ul><li>Plafond : grande aile du sphénoïde ; paroi interne : lame externe du ptérygoïde, séparée du maxillaire par la <b>fissure ptérygo-maxillaire</b> ; paroi latérale : branche de la mandibule ; paroi postérieure : processus styloïde du temporal</li></ul></div></section><section class=\"sec\"><h3>Fissure ptérygo-maxillaire</h3><div><ul><li>Fente verticale, plus large en haut, entre le processus ptérygoïde et la tubérosité maxillaire ; fermée en bas par le <b>processus pyramidal du palatin</b> ; donne accès à la <b>fosse ptérygo-maxillaire</b></li></ul></div></section><figure><img loading=\"lazy\" src=\"images/034-1.jpg\" alt=\"Fosse infra-temporale — Mémento p. 57\"><figcaption>Fosse infra-temporale — Mémento p. 57</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 189-190. Images : Mémento Anatomia, Livre III.</p>"], "35": ["La fosse infra-temporale · contenu", "<section class=\"sec\"><h3>Contenu</h3><div><ul><li>Muscles <b>ptérygoïdiens interne et externe</b>, branches du <b>nerf mandibulaire</b>, <b>corde du tympan</b>, <b>ganglion otique d’Arnold</b>, <b>artère maxillaire</b>, <b>plexus veineux ptérygoïdien</b></li><li>Le <b>ptérygoïdien externe</b> est la position clé : branches du mandibulaire en profondeur, artère maxillaire en dehors ; le nerf buccal passe entre les 2 faisceaux ; ptérygoïdien interne et nerf alvéolaire inférieur sortent sous son bord inférieur ; vaisseaux et nerfs temporaux profonds sortent de son bord supérieur ; plexus veineux autour et dans le muscle</li></ul></div></section><section class=\"sec\"><h3>Clinique</h3><div><ul><li><b>Fractures de Le Fort I, II et III</b> atteignent inévitablement la fosse ; I : au-dessus des processus alvéolaires (paroi externe des fosses nasales, fosse canine, tubérosité, ptérygoïde, vomer) ; II : os nasaux, processus frontal du maxillaire, lacrymal, rebord orbitaire au trou infra-orbitaire, sinus, tubérosité, tiers moyen du ptérygoïde ; III : séparation complète du massif facial de la base du crâne (suture fronto-nasale, paroi externe de l’orbite, arcade zygomatique, ptérygoïde à la base)</li><li><b>Infection</b> : une collection du sinus maxillaire (fractures zygomatiques complexes) ou la 3e molaire inférieure (péricoronarite, abcès, extraction) peut diffuser dans la fosse, vers l’orbite (fissure orbitaire inférieure) puis le <b>sinus caverneux</b> ; symptôme : <b>trismus</b> (ptérygoïdien interne)</li><li>Lésions nerveuses (maxillaire, mandibulaire, corde du tympan) : troubles sensitifs et gustatifs ; ganglions de Meckel ou d’Arnold : sécrétions lacrymale, nasale, salivaire</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/034-1.jpg\" alt=\"Fosse infra-temporale — Mémento p. 57\"><figcaption>Fosse infra-temporale — Mémento p. 57</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 190-196. Images : Mémento Anatomia, Livre III.</p>"], "36": ["La fosse ptérygo-maxillaire", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Fosse ptérygo-palatine : en profondeur dans la partie postéro-latérale de la face, sous la cavité crânienne, au-dessus de la voûte palatine ; <b>pyramide quadrilatère</b> : 4 parois, une base, un sommet</li></ul></div></section><section class=\"sec\"><h3>Parois</h3><div><ul><li><b>Antérieure</b> : tubérosité du maxillaire ; trous dentaires postérieurs (2-3) : nerfs et artères dentaires postérieurs (la plupart s’ouvrent devant la fosse, côté infra-temporale)</li><li><b>Postérieure</b> (face antérieure du processus ptérygoïde) : <b>foramen rond</b> (nerf maxillaire) ; orifice du <b>canal ptérygo-palatin</b> (nerf pharyngien de Bock, artère ptérygo-palatine) ; orifice du <b>canal vidien</b> (nerf et artère vidiens)</li><li><b>Interne</b> : face externe de la lame verticale du palatin ; <b>trou sphéno-palatin</b> (large communication avec la fosse nasale : fin de l’artère maxillaire interne → <b>artère sphéno-palatine</b>)</li><li><b>Externe</b> : <b>fissure ptérygo-maxillaire</b> (vers la fosse infra-temporale)</li></ul></div></section><section class=\"sec\"><h3>Sommet et base</h3><div><ul><li><b>Sommet</b> (inférieur) : angle dièdre aigu <b>ptérygo-maxillaire</b></li><li><b>Base</b> (postérieure, vers la base du crâne) : partie interne = grande aile du sphénoïde ; partie externe = <b>fissure orbitaire inférieure</b> (nerf maxillaire, artère sous-orbitaire)</li></ul></div></section><section class=\"sec\"><h3>Contenu et communications</h3><div><ul><li><b>Portion terminale de l’artère maxillaire interne</b>, <b>nerf maxillaire</b> et <b>ganglion sphéno-palatin de Meckel</b></li><li>Communications : <b>crâne</b> (foramen rond) ; <b>fosse nasale</b> (canaux sphéno-palatin et ptérygo-palatin) ; <b>fosse infra-temporale</b> (paroi externe) ; <b>orbite</b> (fente sphéno-maxillaire) ; <b>voûte palatine</b> (canal palatin postérieur et canaux accessoires)</li><li><b>Canal palatin postérieur</b> : né de l’angle inférieur de la fosse, vertical, s’ouvre dans l’angle postéro-externe de la voûte palatine : artère palatine descendante, nerf palatin antérieur ; <b>canaux accessoires</b> (généralement 2, en arrière) : nerfs palatins moyen et postérieur</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/036-1.jpg\" alt=\"Fosse ptérygo-palatine — Mémento p. 59\"><figcaption>Fosse ptérygo-palatine — Mémento p. 59</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 191-194. Images : Mémento Anatomia, Livre III.</p>"], "37": ["Le palais osseux", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Voûte palatine (palatum durum) : squelette de la paroi supérieure de la cavité buccale ; arquée dans les 2 sens, en fer à cheval (concavité en arrière), dimensions maximales dans la région molaire</li><li>De chaque côté : processus palatin du maxillaire, face interne du maxillaire sous lui, lame horizontale du palatin ; en arrière, extrémité inférieure du ptérygoïde et processus pyramidal du palatin ; <b>4 os</b> : 2 maxillaires (devant), 2 palatins (derrière)</li><li>Limites : rebord alvéolaire en avant et sur les côtés ; suture ptérygo-palatine ; en arrière 2 lignes courbes (bord postérieur des lames horizontales) qui forment l’<b>épine nasale postérieure</b></li></ul></div></section><section class=\"sec\"><h3>Configuration externe</h3><div><ul><li><b>4 sutures</b> : médiane (palatine médiane), 2 latérales (transverses, maxillo-palatines) → <b>suture cruciforme</b> (croix latine, branche antérieure la plus longue)</li><li>Suture transverse : rectiligne (21 %), concavité postérieure (la plus fréquente, 64 %) ou concavité antérieure (la plus rare) — Stieda, 1701 crânes</li><li><b>Fosse incisive</b> (orifice unique des 2 canaux palatins antérieurs) à l’extrémité antérieure ; Scarpa : 2 petits orifices au fond (antérieur → fosse nasale gauche, postérieur → droite) ; nerf sphéno-palatin interne de Hirschfeld et branche interne de l’artère sphéno-palatine</li><li><b>Canaux palatins postérieurs</b> (grands canaux palatins) en arrière et en dehors de la lame horizontale du palatin, avec 1-2 canaux accessoires : nerf palatin antérieur + artère palatine descendante ; accessoires : nerfs palatins moyen et postérieur</li><li>Nombreux petits orifices et dépressions des glandes palatines ; gouttière externe pour l’artère palatine descendante et le nerf palatin antérieur</li></ul></div></section><section class=\"sec\"><h3>Muqueuse, torus et formes</h3><div><ul><li>Muqueuse épaisse adhérente au périoste, épithélium pavimenteux stratifié kératinisé ; <b>raphé palatin</b> médian, <b>papille incisive</b>, <b>rugae palatinae</b> (moitié antérieure) ; glandes salivaires muqueuses dans la sous-muqueuse postérieure</li><li><b>Torus palatinus</b> : crête osseuse de la suture médiane, en fuseau, du canal palatin antérieur à l’épine nasale postérieure (parfois exagérée, lancéolée)</li><li><b>Formes de la voûte</b> (selon l’arcade alvéolaire) : hyperbolique et parabolique (race blanche), en <b>upsilon (U) (rare, singes anthropoïdes), elliptique</li></ul></div></section><section class=\"sec\"><h3>Communications et indices</h3><div><ul><li><b>Fosses nasales</b> (canal palatin antérieur) ; <b>fosse ptérygo-maxillaire</b> (canal palatin postérieur et canaux accessoires) ; face supérieure = plancher nasal, épithélium cilié respiratoire</li><li><b>Indice palatin</b> = diamètre transversal maximal × 100 / diamètre antéro-postérieur (du canal palatin antérieur à l’épine nasale postérieure)</li></ul></div></section><div class=\"tip\">Le Mémento ne propose pas de planche dédiée au palais osseux : aucune image pour ce sujet (voir la planche de l’os palatin, sujet 24).</div><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 184-188. Images : Mémento Anatomia, Livre III.</p>"], "38": ["Les foramina de la base du crâne", "<section class=\"sec\"><h3>Étage antérieur</h3><div><ul><li><b>Foramen cæcum</b> : veine émissaire du sinus sagittal supérieur</li><li><b>Fente ethmoïdale</b> : artère, veine et nerf ethmoïdaux antérieurs (nerf nasal interne, prolongement de la dure-mère) ; trous de la <b>lame criblée</b> : nerfs olfactifs (I) ; <b>trou ethmoïdal postérieur</b> : artère, veine et nerf ethmoïdaux postérieurs</li></ul></div></section><section class=\"sec\"><h3>Étage moyen</h3><div><ul><li><b>Canal optique</b> : nerf optique (II), artère ophtalmique</li><li><b>Fissure orbitaire supérieure</b> : nerfs oculomoteur (III), trochléaire (IV), ophtalmique (nasociliaire, frontal, lacrymal) (V1), abducens (VI), veine ophtalmique supérieure</li><li><b>Foramen rond</b> : nerf maxillaire (V2) ; <b>foramen ovale</b> : nerf mandibulaire (V3), artère méningée accessoire, petit nerf pétreux ; <b>foramen épineux</b> : artère et veine méningées moyennes, rameau méningé du nerf mandibulaire ; <b>foramen veineux du sphénoïde</b> (Vésale, inconstant) : veine émissaire</li><li><b>Foramen déchiré</b> : nerf grand pétreux (nerf du canal ptérygoïdien) ; <b>canal carotidien</b> : artère carotide interne, plexus carotidien interne ; hiatus du grand et du petit nerf pétreux</li></ul></div></section><section class=\"sec\"><h3>Étage postérieur</h3><div><ul><li><b>Méat acoustique interne</b> : nerf facial (VII), nerf vestibulo-cochléaire (VIII), artère labyrinthique ; <b>aqueduc du vestibule</b> : conduit endolymphatique ; <b>foramen mastoïdien</b> (inconstant) : veine émissaire, parfois branche de l’artère méningée postérieure</li><li><b>Foramen jugulaire</b> (trou déchiré postérieur) : sinus pétreux inférieur, nerfs glosso-pharyngien (IX), vague (X), accessoire (XI), artère méningée postérieure, sinus sigmoïde → veine jugulaire interne</li><li><b>Canal de l’hypoglosse</b> (condylien antérieur) : nerf hypoglosse (XII) ; <b>canal condylien postérieur</b> (inconstant) : veine émissaire et rameau méningé de l’artère pharyngienne ascendante</li><li><b>Foramen magnum</b> : bulbe rachidien, méninges, artères vertébrales, racines spinales du nerf accessoire (XI)</li></ul></div></section><div class=\"tip\">Les fiches 8, 9-11, 14-15 et 19 détaillent la position et les rapports de chacun de ces orifices ; ici, seulement leur contenu.</div><figure><img loading=\"lazy\" src=\"images/019-1.jpg\" alt=\"Base du crâne, vue endocrânienne avec ses foramens et leur contenu — Mémento p. 35\"><figcaption>Base du crâne, vue endocrânienne avec ses foramens et leur contenu — Mémento p. 35</figcaption></figure><p class=\"src\">Source du texte : <b>Mémento Anatomia, Livre III</b> (tableau des foramens, p. 35), complété par le <b>Livre Dr. Anca</b>, p. 109-112 (étages de la base du crâne). Images : Mémento Anatomia, Livre III.</p>"], "39": ["Muscles masticateurs · élévateurs de la mandibule", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li><b>4 muscles masticateurs</b> de chaque côté : temporal, masséter, ptérygoïdien latéral, ptérygoïdien médial ; tous innervés par des rameaux du <b>nerf mandibulaire</b> (branche du trijumeau)</li><li><b>Élévateurs</b> : temporal, masséter et ptérygoïdien médial</li></ul></div></section><section class=\"sec\"><h3>Muscle temporal</h3><div><ul><li>Large, plat, radié, dans la <b>fosse temporale</b> ; fibres convergeant vers le <b>processus coronoïde</b></li><li><b>Origine</b> : toute la fosse temporale ; ligne temporale inférieure et crête infra-temporale ; moitié ou 2/3 supérieurs de la face profonde du fascia temporal ; <b>trajet</b> : fibres antérieures presque verticales, moyennes obliques en bas et en avant, postérieures presque horizontales</li><li><b>Terminaison</b> : processus coronoïde et branche de la mandibule</li><li><b>Fascia temporal</b> épais, blanc bleuâtre : s’insère en haut sur le bord postéro-supérieur du zygomatique, la ligne temporale et la ligne temporale supérieure ; se divise vers le tiers ou quart inférieur en 2 lames (superficielle, profonde) sur les 2 lèvres du bord supérieur de l’arcade</li><li><b>Vascularisation</b> : artère maxillaire (fibres antérieures et moyennes), artère temporale superficielle (fibres postérieures) ; <b>innervation</b> : nerfs temporaux profonds antérieur (nerf buccal), moyen (nerf mandibulaire), postérieur (nerf massétérin)</li><li><b>Action</b> : élévateur et rétracteur de la mandibule (fermeture de la bouche) ; les faisceaux postérieurs assurent le retour du condyle en arrière</li></ul></div></section><section class=\"sec\"><h3>Muscle masséter</h3><div><ul><li>Court, épais, rectangulaire, de l’<b>arcade zygomatique</b> à la face latérale de la branche de la mandibule</li><li><b>Faisceau superficiel</b> : naît par une épaisse lame tendineuse des 3/4 antérieurs du bord inférieur de l’arcade (empiète sur la pyramide du maxillaire) ; fibres obliques en bas et en arrière ; s’insère sur l’angle, le bord inférieur et la partie inférieure de la face latérale de la branche (directement ou par des lames tendineuses aux crêtes obliques)</li><li><b>Faisceau moyen</b> : sur tout le bord inférieur de l’arcade ; fibres verticales ; s’insère au-dessus du précédent</li><li><b>Fascia massétérique</b> : fixé à l’arcade, au bord inférieur et au bord postérieur de la mandibule, au bord antérieur du processus coronoïde et de la branche ; continué en arrière par le fascia parotidien</li><li><b>Vascularisation</b> : artère massétérique profonde (maxillaire) et superficielle (faciale) ; <b>innervation</b> : nerf mandibulaire ; <b>action</b> : élévateur (fermeture de la bouche)</li></ul></div></section><section class=\"sec\"><h3>Muscle ptérygoïdien médial</h3><div><ul><li>Épais, quadrilatère, en dedans du ptérygoïdien latéral ; de la <b>fosse ptérygoïde</b> à la <b>face médiale de l’angle de la mandibule</b></li><li><b>Origine</b> : toute la fosse ptérygoïde sauf la fossette scaphoïde et la partie postérieure de la paroi médiale (rapport avec le tenseur du voile du palais) ; corps charnu oblique en bas, en arrière et en dehors ; <b>terminaison</b> : face médiale de l’angle et de la branche, près de l’angle</li><li><b>Fascia interptérygoïdien</b> entre les 2 ptérygoïdiens (quadrilatère, plan oblique de haut en bas, de dedans en dehors, d’avant en arrière), confondu en bas avec la gaine du ptérygoïdien médial</li><li><b>Vascularisation</b> : artère ptérygoïdienne (maxillaire) ; <b>innervation</b> : tronc commun du nerf mandibulaire ; <b>action</b> : élévateur (contraction bilatérale), diduction (unilatérale)</li></ul></div></section><div class=\"tip\">Divergence : le Mémento écrit que le masséter naît du « processus zygomatique du Frontal » (terme tel qu’écrit) ; le TP 20 le fait naître de l’arcade zygomatique, ce que reprend cette fiche.</div><figure><img loading=\"lazy\" src=\"images/039-1.jpg\" alt=\"Muscles masticateurs : temporal, masséter, ptérygoïdiens — Mémento p. 67\"><figcaption>Muscles masticateurs : temporal, masséter, ptérygoïdiens — Mémento p. 67</figcaption></figure><p class=\"src\">Source du texte : <b>Recueil CM/TP Dr. Anca</b> (TP 20, p. 167-169). Compléments : Mémento Anatomia, Livre III (p. 66 : vascularisation, innervation, action). Images : Mémento Anatomia, Livre III.</p>"], "40": ["Muscles abaisseurs de la mandibule", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Muscles <b>supra-hyoïdiens</b> (4) sur 3 plans : plan profond = <b>génio-hyoïdien</b> ; plan moyen = <b>mylo-hyoïdien</b> ; plan superficiel = <b>digastrique</b> et <b>stylo-hyoïdien</b></li><li>Abaisseurs de la mandibule (points fixes sur l’os hyoïde) : <b>génio-hyoïdien, mylo-hyoïdien, ventre antérieur du digastrique</b> ; si le point fixe est sur la mandibule, ils élèvent l’os hyoïde ; ventre postérieur du digastrique et stylo-hyoïdien : élévateurs de l’os hyoïde</li><li>Les <b>muscles infra-hyoïdiens</b> (abaisseurs de l’hyoïde) fixent l’insertion inférieure des supra-hyoïdiens et concourent à l’abaissement de la mandibule</li></ul></div></section><section class=\"sec\"><h3>Muscle digastrique</h3><div><ul><li>Allongé, <b>2 ventres</b> réunis par un tendon intermédiaire ; de la région mastoïdienne jusqu’au voisinage de la symphyse mentonnière, en s’incurvant au-dessus de l’os hyoïde</li><li><b>Ventre postérieur</b> : naît de la rainure digastrique du processus mastoïde (fibres charnues et tendineuses) ; <b>tendon intermédiaire</b> cylindrique, qui traverse presque toujours le stylo-hyoïdien (ou passe en dedans ou en dehors), s’engage dans une coulisse fibreuse de la lame superficielle du fascia cervical, puis s’infléchit en avant et en haut</li><li><b>Ventre antérieur</b> : aplati de haut en bas, appliqué sur le mylo-hyoïdien ; s’attache à la <b>fossette digastrique</b> du bord inférieur de la mandibule</li><li><b>Vascularisation</b> : artère mylo-hyoïdienne et rameau de la maxillaire ; <b>innervation</b> : nerf mandibulaire (ventre antérieur) et <b>nerf facial</b> (ventre postérieur) ; <b>action</b> : abaisseur (ventre antérieur), rétracteur de la mandibule (ventre postérieur)</li></ul></div></section><section class=\"sec\"><h3>Muscle mylo-hyoïdien</h3><div><ul><li>Large, aplati, mince, tendu transversalement de la <b>face médiale de la mandibule</b> à l’os hyoïde et au raphé médian (plancher de la bouche)</li><li><b>Origine</b> : ligne oblique interne (mylo-hyoïdienne), sur toute sa longueur ; fibres antérieures très courtes, presque horizontales, longueur croissante d’avant en arrière</li><li><b>Terminaison</b> : fibres antérieures et moyennes sur le <b>raphé tendineux médian</b> (mandibule – hyoïde) ; fibres postérieures sur la face antérieure du corps de l’os hyoïde, sous le génio-hyoïdien</li><li><b>Vascularisation</b> : artère mylo-hyoïdienne et rameau de la maxillaire ; <b>innervation</b> : nerf mylo-hyoïdien (nerf mandibulaire) ; <b>action</b> : abaisseur accessoire de la mandibule</li></ul></div></section><section class=\"sec\"><h3>Muscle génio-hyoïdien</h3><div><ul><li>Court, aplati de haut en bas, assez épais, juxta-médian ; de la partie médiane de la mandibule à l’os hyoïde</li><li><b>Origine</b> : épine mentonnière (apophyse génie) inférieure ; <b>terminaison</b> : face antérieure du corps de l’os hyoïde</li><li><b>Vascularisation</b> : artère linguale (carotide externe) ; <b>innervation</b> : nerf hypoglosse (XII) ; <b>action</b> : abaisseur accessoire de la mandibule</li></ul></div></section><section class=\"sec\"><h3>Platysma (accessoire)</h3><div><ul><li>Selon le Mémento, 4e muscle « abaisseur de l’ATM » : origine sur la ligne oblique externe de la mandibule, insertion sur la face profonde de la peau des régions infra-claviculaire et deltoïdienne ; artère faciale ; rameau cervico-facial du nerf facial (VII) ; abaisseur accessoire de la mandibule</li></ul></div></section><div class=\"tip\">Divergence : le TP 21 désigne par « ventre antérieur » le corps charnu qui naît de la mastoïde (terme tel qu’écrit dans le recueil) ; cette fiche suit le Mémento et le reste du TP : ventre postérieur = mastoïde, ventre antérieur = fossette digastrique.</div><figure><img loading=\"lazy\" src=\"images/040-1.jpg\" alt=\"Muscles sus-hyoïdiens : mylo-hyoïdien, digastrique, stylo-hyoïdien — Mémento p. 69\"><figcaption>Muscles sus-hyoïdiens : mylo-hyoïdien, digastrique, stylo-hyoïdien — Mémento p. 69</figcaption></figure><p class=\"src\">Source du texte : <b>Recueil CM/TP Dr. Anca</b> (TP 21, p. 173-175). Compléments : Mémento Anatomia, Livre III (p. 68 : vascularisation, innervation, action). Images : Mémento Anatomia, Livre III.</p>"], "41": ["Muscles propulseurs et rétropulseurs de la mandibule", "<section class=\"sec\"><h3>Mouvement</h3><div><ul><li><b>Propulsion</b> : la mâchoire inférieure est portée en avant (l’arcade dentaire inférieure passe devant la supérieure) ; <b>rétropulsion</b> : mouvement inverse</li><li>Ces mouvements se passent surtout dans l’articulation <b>ménisco-temporale</b> (translation du condyle)</li></ul></div></section><section class=\"sec\"><h3>Muscle ptérygoïdien latéral (propulseur)</h3><div><ul><li>Court, épais, aplati transversalement, dans la <b>région ptérygo-maxillaire</b> ; du processus ptérygoïde au <b>col du condyle</b> de la mandibule</li><li><b>2 chefs d’origine</b> : <b>faisceau sphénoïdal (supérieur)</b> : partie horizontale de la face latérale de la grande aile du sphénoïde et crête infra-temporale ; <b>faisceau ptérygoïdien (inférieur)</b> : 3/4 ou 2/3 inférieurs de la face latérale de l’aile latérale du processus ptérygoïde et face latérale du processus pyramidal du palatin</li><li>Les 2 faisceaux convergent en arrière et en dehors vers l’ATM : le sphénoïdal est presque horizontal, le ptérygoïdien oblique en haut, en arrière et en dehors ; séparés d’abord par un interstice celluleux où passe l’<b>artère maxillaire</b> dans la moitié des cas</li><li><b>Terminaison</b> : fossette antéro-interne du col du condyle (par de courtes fibres tendineuses, les insertions débordant en général cette fossette, surtout vers le bas) ; quelques faisceaux s’insèrent aussi sur la face antérieure de la capsule articulaire et, par elle, sur le <b>ménisque articulaire</b></li><li><b>Vascularisation</b> : artère maxillaire (rameaux ptérygoïdiens) ; <b>innervation</b> : rameau du nerf buccal (nerf mandibulaire)</li><li><b>Action</b> : la contraction <b>simultanée des 2 ptérygoïdiens latéraux</b> détermine la <b>propulsion</b></li></ul></div></section><section class=\"sec\"><h3>Rétropulseurs</h3><div><ul><li><b>Faisceaux postérieurs du temporal</b> : contribuent largement au retour du condyle en arrière après l’abaissement ; fibres presque horizontales ; action globale du temporal : élévateur et rétracteur de la mandibule</li><li><b>Ventre postérieur du digastrique</b> : rétracteur de la mandibule (innervé par le nerf facial)</li></ul></div></section><div class=\"tip\">Divergence de nomenclature : la fossette d’insertion sur le col du condyle est dite « fossette antéro-interne » (TP 20), « fossette scaphoïde » (Mémento) et « fossette ptérygoïdienne » (Livre Dr. Anca, mandibule) ; il s’agit de la même dépression du col.</div><figure><img loading=\"lazy\" src=\"images/039-1.jpg\" alt=\"Muscles masticateurs et ptérygoïdiens — Mémento p. 67\"><figcaption>Muscles masticateurs et ptérygoïdiens — Mémento p. 67</figcaption></figure><p class=\"src\">Source du texte : <b>Recueil CM/TP Dr. Anca</b> (TP 20, p. 167-169 ; Cours 14, p. 106-107). Compléments : Mémento Anatomia, Livre III (p. 66, 68 : vascularisation, innervation, action ; Livre Dr. Anca, mandibule, p. 154-162 pour la fossette du col). Images : Mémento Anatomia, Livre III.</p>"], "42": ["Muscles de la diduction", "<section class=\"sec\"><h3>Mouvement</h3><div><ul><li><b>Latéralité ou diduction</b> : le menton est porté à droite ou à gauche ; le processus condylaire du <b>même côté pivote sur place</b>, tandis que celui du côté opposé <b>avance</b> et se place sous le tubercule articulaire</li></ul></div></section><section class=\"sec\"><h3>Muscle ptérygoïdien latéral</h3><div><ul><li>La contraction d’<b>un seul</b> ptérygoïdien latéral produit la diduction : l’un des condyles pivote tandis que l’autre se porte en avant</li><li>Origines, trajet et terminaison : voir la fiche des propulseurs (sujet 41)</li><li>Mémento : <b>diduction</b> en contraction unilatérale, <b>propulsion</b> en contraction bilatérale</li></ul></div></section><section class=\"sec\"><h3>Muscle ptérygoïdien médial</h3><div><ul><li>Épais, quadrilatère, de la <b>fosse ptérygoïde</b> à la face médiale de l’angle de la mandibule ; en dedans du ptérygoïdien latéral, dont le sépare le <b>fascia interptérygoïdien</b></li><li><b>Innervation</b> : tronc commun du nerf mandibulaire ; <b>vascularisation</b> : artère ptérygoïdienne (maxillaire)</li><li><b>Action</b> : élévateur de la mandibule en contraction bilatérale, <b>diduction</b> en contraction unilatérale</li></ul></div></section><div class=\"tip\">À retenir : la diduction est un mouvement unilatéral ; les mêmes muscles agissent en propulsion ou en élévation quand ils se contractent des 2 côtés.</div><figure><img loading=\"lazy\" src=\"images/039-1.jpg\" alt=\"Muscles masticateurs et ptérygoïdiens — Mémento p. 67\"><figcaption>Muscles masticateurs et ptérygoïdiens — Mémento p. 67</figcaption></figure><p class=\"src\">Source du texte : <b>Recueil CM/TP Dr. Anca</b> (TP 20, p. 167-169 ; Cours 14, p. 106-107). Compléments : Mémento Anatomia, Livre III (p. 66 : innervation, vascularisation, action). Images : Mémento Anatomia, Livre III.</p>"]};const nav=document.querySelector('nav'),main=document.querySelector('main');let last='',h='';
