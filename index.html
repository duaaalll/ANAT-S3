/* ===== Anatomie S3 — clone visuel « Atlas Netter » ===== */
:root{--hh:64px;--page:#FFFFFF;--nav:#F8F9FA;--hover:#F0F2F4;--head:#6B8CAD;--steel:#6B8CAD;--steel-dk:#4F6F91;--ink:#222222;--bold:#1A1A1A;--muted:#6A6F75;--faint:#9AA0A6;--line:#EAEAEA;--clin:#801A33;--mask:#DADDE1;--art:#9B2335;--vein:#3E6A9E;--nerf:#8A6D1F;--scroll:#D5D8DC;color-scheme:light}
:root[data-theme=dark]{--page:#1A1B1D;--nav:#212225;--hover:#2A2C30;--head:#3F5873;--steel:#7E9FC2;--steel-dk:#9DBBDC;--ink:#E2E3E4;--bold:#F6F6F6;--muted:#A3A8AE;--faint:#7C8289;--line:#33353A;--clin:#E07C95;--mask:#3A3D43;--art:#EE8A96;--vein:#86AEE0;--nerf:#D9B85C;--scroll:#3A3D43;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body,main{background:var(--page)}
body{margin:0;transition:background-color .3s,color .3s;color:var(--ink);font:15.5px/1.6 'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}

/* --- Bandeau : bleu acier mat, texte blanc fin --- */
header{position:sticky;top:0;z-index:20;height:var(--hh);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:0 30px;background:var(--head);color:#fff;border:0;box-shadow:none}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
header h1{margin:0;font:300 25px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.01em;color:#fff}
.tag{font:300 12.5px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.02em;text-transform:none;color:rgba(255,255,255,.88);margin-top:3px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:10px;justify-self:end;min-width:0}
.search{position:relative;display:block}.search svg{position:absolute;left:12px;top:50%;width:15px;height:15px;transform:translateY(-50%);stroke:#fff;fill:none;stroke-width:1.5;pointer-events:none}
header input{font:300 14px 'Helvetica Neue',Helvetica,Arial,sans-serif;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 12px 8px 34px;border-radius:2px;width:270px;max-width:36vw;transition:background-color .2s,border-color .2s}
header input::placeholder{color:rgba(255,255,255,.8)}
header input:focus{outline:none;background:rgba(255,255,255,.24);border-color:#fff}
.ibtn{display:grid;place-items:center;width:38px;height:38px;border-radius:2px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;transition:background-color .2s,border-color .2s}
.ibtn:hover{background:rgba(255,255,255,.18);border-color:#fff}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.ibtn[aria-pressed=true]{background:#fff;border-color:#fff;color:#4F6F91}
#rev .i-off,body.revision #rev .i-on{display:none}body.revision #rev .i-off{display:block}
#theme .i-moon{display:none}:root[data-theme=dark] #theme .i-sun{display:none}:root[data-theme=dark] #theme .i-moon{display:block}
#bar{position:fixed;top:0;left:0;height:2px;background:var(--clin);z-index:30;width:0}
#burger{display:none;background:none;border:0;color:#fff;font-size:26px;cursor:pointer;padding:0 4px}

/* --- Colonne latérale --- */
nav{position:fixed;top:var(--hh);bottom:0;left:0;width:310px;overflow:auto;background:var(--nav);border-right:1px solid var(--line);padding:10px 0 56px;scrollbar-width:thin;scrollbar-color:var(--scroll) transparent}
nav h4{margin:28px 24px 8px;padding-bottom:6px;border-bottom:1px solid var(--line);font:700 12px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.02em;text-transform:none;color:var(--steel-dk)}nav h4:first-child{margin-top:18px}
nav a{display:flex;align-items:baseline;gap:10px;margin:0 12px;padding:7px 12px;color:var(--ink);text-decoration:none;font:400 14px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;border-radius:0;border-left:2px solid transparent}
nav a i{flex:0 0 26px;font:400 12px 'Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums;color:var(--faint);font-style:normal;text-align:right}
nav a:hover{background:var(--hover)}
nav a.on{border-left-color:var(--steel);color:var(--steel-dk);font-weight:700;background:var(--hover)}
nav a.todo{color:var(--faint);font-style:normal}nav a.todo:hover{color:var(--muted)}
nav a.todo::after{content:'à venir';margin-left:auto;flex:none;font:300 11px 'Helvetica Neue',Helvetica,Arial,sans-serif;text-transform:none;letter-spacing:0;color:var(--faint);padding:0}

/* --- Pages : du texte imprimé sur du blanc --- */
main{margin-left:310px;padding:36px 56px 90px;max-width:980px}
.card{interpolate-size:allow-keywords;background:transparent;border:0;border-radius:0;box-shadow:none;margin:0 0 6px;overflow:hidden;scroll-margin-top:calc(var(--hh) + 16px)}
.card:hover,.card[open]{box-shadow:none;transform:none}
.card>summary{position:relative;display:flex;gap:18px;align-items:baseline;padding:14px 4px;cursor:pointer;list-style:none;border:0;background:none}
.card[open]>summary{background:none;border:0;padding-bottom:10px}
.card>summary::-webkit-details-marker{display:none}.card>summary:hover .ttl{color:var(--steel-dk)}
.card>summary::before{display:none}
.card>summary::after{content:'';flex:none;margin-left:auto;align-self:center;width:7px;height:7px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg) translateY(-2px);transition:transform .3s}.card[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.card::details-content{height:0;overflow:clip;transition:height .38s cubic-bezier(.2,.7,.2,1),content-visibility .38s allow-discrete}.card[open]::details-content{height:auto}
.card[open]>.body,.card[open]>.soon{animation:reveal .4s cubic-bezier(.2,.7,.2,1)}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.num{font:700 20px 'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--steel);min-width:40px;font-variant-numeric:tabular-nums}
.ttl{font:700 20px/1.3 'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);transition:color .2s}
.sub{margin-top:2px;font:300 13px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:0;text-transform:none;color:var(--muted)}
.body{padding:2px 4px 30px 4px;max-width:760px;margin-left:58px}
.sec{display:block;padding:0;margin:0 0 18px;border:0}
h3{margin:0 0 4px;padding:0;font:700 15px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:0;text-transform:none;color:var(--steel-dk)}

/* --- Listes : texte courant, aéré, sans puces --- */
ul{list-style:none;padding:0;margin:0}
li{padding:0;margin:0 0 .5em;position:relative;line-height:1.6;font:400 15.5px/1.6 'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
li:before{content:none}

/* --- Gras sobre ; code « Clinique » bordeaux Netter --- */
b{color:var(--bc,var(--bold));font-weight:800}
.clinique,.tip{color:var(--clin);font-weight:500}
.clinique b,.tip b{color:var(--clin);font-weight:700}
.art{--bc:var(--art);color:var(--bc)}.vein{--bc:var(--vein);color:var(--bc)}.nerf{--bc:var(--nerf);color:var(--bc);background:none;padding:0}
.art,.vein,.nerf{font-weight:600}
.src{margin:14px 0 0;padding:0;border:0;font-size:12px;line-height:1.5;color:var(--muted);font-weight:300}
.tip{background:none;border:0;border-radius:0;padding:0;margin:12px 0;font-style:normal;font-size:15px;line-height:1.6;text-align:justify;hyphens:auto}
.soon{padding:6px 4px 20px 62px;color:var(--muted);font-style:normal;font-weight:300}
figure{margin:18px 0}figure img{width:100%;border-radius:0;box-shadow:none;background:#fff;border:1px solid var(--line)}figcaption{font:300 12.5px 'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--muted);margin-top:6px;font-style:normal}
figure.inl{margin:14px 0 6px;max-width:560px}figure.inl img{cursor:zoom-in;width:100%;border-radius:0;border:1px solid var(--line);background:#fff;box-shadow:none}figure.inl figcaption{margin-top:6px}
figure img{cursor:zoom-in}

/* --- Mode révision : texte masqué façon surligneur gris --- */
body.revision b{color:transparent;background:var(--mask);border-radius:2px;cursor:pointer;user-select:none;transition:background-color .2s,color .2s}
body.revision b:hover,body.revision b.show{color:var(--bc,var(--bold));background:transparent;user-select:auto}
body.revision .clinique b:hover,body.revision .clinique b.show,body.revision .tip b:hover,body.revision .tip b.show{color:var(--clin)}

#top{position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:2px;border:1px solid var(--line);background:var(--page);color:var(--steel-dk);font-size:18px;cursor:pointer;box-shadow:none;transition:background-color .2s,color .2s}#top:hover{background:var(--head);color:#fff;border-color:var(--head)}
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,22,26,.9);display:grid;place-items:center;padding:10px;cursor:zoom-out;animation:reveal .25s}.lb img{max-width:100%;max-height:100%;background:#fff;box-shadow:0 20px 60px #000a}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media(max-width:900px){.tag{display:none}header input{width:190px}main{padding:30px 28px 80px}}

.search{grid-area:2/1/3/5}header input{width:100%;max-width:none}.search svg{left:10px}.tag{display:block;font-size:11.5px}.ibtn{width:38px;height:38px}

main{margin-left:0;padding:14px 14px 80px}.card>summary{padding:12px 2px;gap:12px}.num{font-size:17px;min-width:28px}.ttl{font-size:17px}.body{margin-left:0;padding:2px 2px 24px}.soon{padding-left:42px}}

:root[data-theme=dark] figure img{opacity:.92}

œsophage"], [110, "L'œsophage cervical", "Pharynx, larynx, thyroïde, trachée, œsophage"], [111, "La loge parotidienne : parois", "Glandes & langue"], [112, "La loge parotidienne : contenu", "Glandes & langue"], [113, "La glande parotide", "Glandes & langue"], [114, "La loge submandiculaire", "Glandes & langue"], [115, "La glande submandiculaire", "Glandes & langue"], [116, "La loge sublinguale", "Glandes & langue"], [117, "La glande sublinguale", "Glandes & langue"], [118, "La langue : conformation externe et rapports", "Glandes & langue"], [119, "La langue : vascularisation et innervation", "Glandes & langue"], [120, "La région fronto-occipitale", "Régions"], [121, "La région temporale", "Régions"], [122, "La région mastoïdienne", "Régions"], [123, "La région orale", "Régions"], [124, "La région mentonnière", "Régions"], [125, "La région génienne", "Régions"], [126, "La région massétérine", "Régions"], [127, "La région palatine", "Régions"], [128, "La région sublinguale", "Régions"], [129, "La région suprahyoïdienne", "Régions"], [130, "La région cervicale antérieure", "Régions"], [131, "La région sternocléidomastoïdienne", "Régions"], [132, "La fosse supraclaviculaire", "Régions"], [133, "La région cervicale postérieure", "Régions"], [134, "Les articulations crânio-vertébrales", "Articulations"], [135, "Les groupes lymphonodulaires de la tête et du cou", "Lymphatiques"]],F={"1": ["Os frontal · neurocrâne", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Os <b>médian, impair et symétrique</b>, à la partie antérieure du crâne</li><li>Comparé à une coquille ou à un segment de sphère déchirée (Cruveilhier)</li><li>S’articule avec les <b>pariétaux, le sphénoïde</b> (en arrière), l’<b>ethmoïde, les os nasaux, les zygomatiques, les lacrymaux et les maxillaires</b> (en bas)</li><li>Participe à la formation de l’<b>orbite</b> et des <b>fosses nasales</b></li><li><b>3 faces</b> (antérieure, inférieure, postérieure) et <b>3 bords</b> (supérieur, antérieur, postérieur)</li></ul></div></section><section class=\"sec\"><h3>Face antérieure (exocrânienne)</h3><div><ul><li>Convexe, lisse ; en rapport avec le tégument dont la sépare le muscle frontal</li><li>Ligne médiane : <b>suture métopique</b> chez l’enfant (vestiges : repli de Ditte chez l’adulte), <b>glabelle</b>, dépression sus-glabellaire avec le point <b>ophryon</b></li><li><b>Bosses frontales latérales</b> (tubérosités) à ~3 cm au-dessus du bord supra-orbitaire, plus marquées chez la femme et l’enfant</li><li>Chéneau vasculaire dans 25 % des cas (branche de l’artère temporale superficielle ou sous-orbitaire)</li><li><b>Arcades sourcilières</b> sous les bosses frontales</li><li><b>Facette temporale</b> (postéro-latérale) : partie antérieure de la fosse temporale, insertion du muscle temporal, limitée par la <b>crête latérale du frontal</b></li></ul><figure class=\"inl\"><img loading=\"lazy\" src=\"images/crops/001-a.jpg\" alt=\"Fig. 3.5 — Os frontal, vue antérieure (Mémento p. 9)\"><figcaption>Fig. 3.5 — Os frontal, vue antérieure (Mémento p. 9)</figcaption></figure></div></section><section class=\"sec\"><h3>Face inférieure (orbitaire)</h3><div><ul><li>Forme le plafond des cavités orbitaires et nasales</li><li>Ligne médiane : <b>gouttière ethmoïdale</b> (en U ouvert en arrière) qui abrite la lame criblée de l’ethmoïde</li><li><b>Épine nasale du frontal</b> en avant (s’articule avec les os nasaux) ; en arrière, crête verticale articulée avec la lame perpendiculaire de l’ethmoïde</li><li>Orifices des <b>sinus frontaux</b> ; en arrière, semi-cellules qui forment avec l’ethmoïde les <b>cellules fronto-ethmoïdales</b></li><li>Chéneaux transversaux → <b>canaux ethmoïdaux</b> : antérieur (nerf ethmoïdal antérieur + artère ethmoïdale antérieure), postérieur (nerf sphéno-ethmoïdal de Luschka + artère ethmoïdale postérieure)</li><li>De chaque côté : <b>fosse orbitaire</b> (plafond de l’orbite) avec <b>fossette lacrymale</b> (glande lacrymale) et <b>fossette trochléaire</b> (trochlée du muscle oblique supérieur)</li></ul><figure class=\"inl\"><img loading=\"lazy\" src=\"images/crops/001-c.jpg\" alt=\"Fig. 3.7 — Os frontal, vue inférieure (Mémento p. 9)\"><figcaption>Fig. 3.7 — Os frontal, vue inférieure (Mémento p. 9)</figcaption></figure></div></section><section class=\"sec\"><h3>Face postérieure (cérébrale)</h3><div><ul><li>En rapport avec les lobes frontaux ; concave en arrière, convexe en bas</li><li>Ligne médiane, de haut en bas : canal du <b>sinus sagittal supérieur</b> → <b>crête du frontal</b> (faux du cerveau) → <b>foramen cæcum</b> (prolongement dure-mérien + veine)</li><li>De chaque côté : <b>fosses frontales</b> (en haut), <b>bosses orbitaires</b> (en bas) avec éminences mamillaires et empreintes digitales</li><li>Fovéoles granulaires près du sinus sagittal supérieur (granulations arachnoïdiennes)</li></ul><figure class=\"inl\"><img loading=\"lazy\" src=\"images/crops/001-b.jpg\" alt=\"Fig. 3.6 — Os frontal, vue postérieure (Mémento p. 9)\"><figcaption>Fig. 3.6 — Os frontal, vue postérieure (Mémento p. 9)</figcaption></figure></div></section><div class=\"tip\">Les auteurs français (Rouvière, Delmas) décrivent 2 faces : exocrânienne (antérieure + inférieure) et endocrânienne (postérieure). Les anglo-saxons (Standring) décrivent 3 parties : écaille, partie nasale, partie orbitaire.</div><figure><img loading=\"lazy\" src=\"images/001-1.jpg\" alt=\"Os frontal, vues et schémas — Mémento p. 9\"><figcaption>Os frontal, vues et schémas — Mémento p. 9</figcaption></figure><figure><img loading=\"lazy\" src=\"images/001-2.jpg\" alt=\"Os frontal — Mémento p. 7\"><figcaption>Os frontal — Mémento p. 7</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 50-54. Images : Mémento Anatomia, Livre III.</p>"], "2": ["Os frontal · bords & sinus", "<section class=\"sec\"><h3>Bord antérieur (orbito-nasal)</h3><div><ul><li>Sépare la face antérieure de la face inférieure</li><li>Ligne médiane : <b>gouttière nasale</b> (en V ouvert en bas) ; articulation avec les os nasaux (médial) et les processus frontaux des maxillaires (latéral)</li><li>De chaque côté : <b>arcade orbitaire</b> à concavité inférieure ; à la jonction 1/3 médial – 2/3 latéraux : <b>canal supra-orbitaire</b> (artère, veine et nerf supra-orbitaires)</li><li>À 1 cm en dedans : <b>incisure frontale</b> pour le nerf supra-trochléaire</li><li><b>Processus orbitaire interne</b> (articulé avec le lacrymal et le processus frontal du maxillaire ; insertion des muscles sourcilier et orbiculaire de l’œil) et <b>processus orbitaire externe</b> (zygomatique, articulé avec l’os malaire)</li><li>Les arcades orbitaires protègent le globe oculaire et sont formées d’os compact</li></ul></div></section><section class=\"sec\"><h3>Bord supérieur (pariétal) et bord postérieur (sphénoïdal)</h3><div><ul><li><b>Supérieur</b> : semi-circulaire, dentelé ; s’articule avec les pariétaux → <b>suture coronale</b> ; point craniométrique <b>bregma</b> sur la ligne médiane</li><li><b>Postérieur</b> : oblique en bas et en dedans ; s’articule avec les <b>petites ailes du sphénoïde</b></li></ul><figure class=\"inl\"><img loading=\"lazy\" src=\"images/crops/002-a.jpg\" alt=\"Fig. 3.4 — Parties de l’os frontal, vue schématique postéro-latérale (Mémento p. 9)\"><figcaption>Fig. 3.4 — Parties de l’os frontal, vue schématique postéro-latérale (Mémento p. 9)</figcaption></figure></div></section><section class=\"sec\"><h3>Sinus frontaux</h3><div><ul><li>2 cavités dans l’épaisseur de l’os, au-dessus et sur les bords de la gouttière ethmoïdale ; hauteur ~20-25 mm, largeur ~25-30 mm, <b>asymétrie fréquente</b></li><li>Forme de <b>pyramide triangulaire</b> (sommet en haut) : 3 faces, 1 base, 1 pointe</li><li><b>Face antérieure</b> : la plus épaisse (4-8 mm) ; <b>postérieure</b> (endocrânienne) : ~1 mm, rapport avec les méninges et le lobe frontal ; <b>médiale</b> : septum mince, souvent dévié</li><li><b>Base</b> : segment externe (orbite) et segment interne (cellules ethmoïdales, fosses nasales) en entonnoir → <b>canal fronto-nasal</b> qui s’ouvre dans le <b>méat moyen</b></li><li>Muqueuse mince, continuation de la muqueuse pituitaire</li><li>Plus développés chez l’homme ; les petits sinus de la femme peuvent être confondus avec une cellule ethmoïdale et ne sont abordables que par l’orbite</li></ul></div></section><div class=\"tip\">Ossification : 2 centres primaires (un par moitié) qui apparaissent à la <b>8e semaine</b> du développement embryonnaire.</div><figure><img loading=\"lazy\" src=\"images/001-1.jpg\" alt=\"Os frontal, vues et schémas — Mémento p. 9\"><figcaption>Os frontal, vues et schémas — Mémento p. 9</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 54-57. Images : Mémento Anatomia, Livre III.</p>"], "3": ["Os pariétal · neurocrâne", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Os <b>pair</b>, derrière le frontal, devant l’occipital, au-dessus du temporal ; forme la plus grande partie de la boîte crânienne</li><li>Quadrilatère : <b>2 faces</b> (externe, interne), <b>4 bords</b>, <b>4 angles</b></li></ul></div></section><section class=\"sec\"><h3>Face externe</h3><div><ul><li>Convexe, lisse ; <b>bosse pariétale</b> près du centre (plus nette chez l’enfant)</li><li>2 <b>lignes courbes temporales</b> : supérieure (aponévrose temporale) et inférieure (muscle temporal) ; au contact avec la suture coronale : <b>staphanion</b></li><li><b>Trou pariétal</b> près du bord supérieur (veine émissaire de Santorini)</li><li>Au-dessus des lignes : aponévrose épicrânienne (galea)</li></ul><figure class=\"inl\"><img loading=\"lazy\" src=\"images/crops/003-a.jpg\" alt=\"Fig. 3.17 — Os pariétal droit, vues externe (A) et interne (B) (Mémento p. 11)\"><figcaption>Fig. 3.17 — Os pariétal droit, vues externe (A) et interne (B) (Mémento p. 11)</figcaption></figure></div></section><section class=\"sec\"><h3>Face interne</h3><div><ul><li>Concave, <b>fosse pariétale</b> centrale</li><li>Chéneaux ramifiés « en feuille de figuier » pour l’<b>artère et la veine méningées moyennes</b>, depuis l’angle antéro-inférieur ; <b>zone décollable de Gérard Marchand</b> (des petites ailes du sphénoïde à 2-3 cm devant la protubérance occipitale interne)</li><li>Éminences mamillaires, empreintes digitales ; <b>fovéoles de Pacchioni</b> près du bord supérieur</li><li><b>Crête sylvienne</b> oblique (scissure latérale de Sylvius)</li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Supérieur</b> : dentelé ; suture sagittale ; semi-gouttière du sinus sagittal supérieur ; <b>obélion</b> au niveau du trou pariétal</li><li><b>Inférieur (squameux)</b> : en biseau ; sphénoïde (court), écaille du temporal (arqué), mastoïde (dentelé) → <b>suture squameuse</b></li><li><b>Antérieur</b> : frontal → <b>suture coronale</b> ; <b>stephanion</b></li><li><b>Postérieur</b> : occipital → <b>suture lambdoïde</b></li></ul></div></section><section class=\"sec\"><h3>Angles</h3><div><ul><li><b>Antéro-supérieur</b> (frontal, ~90°) : <b>bregma</b> (fontanelle antérieure chez le nouveau-né)</li><li><b>Antéro-inférieur</b> (sphénoïdal) : aigu ; <b>ptérion</b></li><li><b>Postéro-supérieur</b> (occipital) : <b>lambda</b> ; obélion à 5 cm en avant</li><li><b>Postéro-inférieur</b> (mastoïdien) : <b>astérion</b> ; gouttière du sinus latéral</li></ul></div></section><div class=\"tip\">Ossification : 2 centres près de la bosse pariétale, apparaissant à la <b>7e semaine</b> intra-utérine, qui fusionnent vite.</div><figure><img loading=\"lazy\" src=\"images/003-1.jpg\" alt=\"Os pariétal — Mémento p. 11\"><figcaption>Os pariétal — Mémento p. 11</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 57-60. Images : Mémento Anatomia, Livre III.</p>"], "4": ["Os ethmoïde · lames", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Du grec « percé » ; os <b>fragile, médian, impair et symétrique</b>, dans la gouttière ethmoïdale du frontal, devant le sphénoïde</li><li>Participe au septum nasal, à la paroi médiale de l’orbite, au plafond et à la paroi latérale des fosses nasales</li><li>3 éléments : <b>lame verticale</b>, <b>lame horizontale</b> (percée) et <b>2 masses latérales</b> (labyrinthes)</li></ul></div></section><section class=\"sec\"><h3>Lame verticale</h3><div><ul><li>Quadrilatère, mince, divisée par la lame horizontale en 2 zones</li><li><b>Zone supérieure = crista galli</b> (triangulaire) : insertion de la <b>faux du cerveau</b> ; son bord antérieur complète le foramen cæcum</li><li><b>Zone inférieure = lame perpendiculaire</b> (cloison nasale) : bord antérieur → épine nasale du frontal ; postérieur → crête du sphénoïde (en haut) et vomer (en bas) ; inférieur épais → cartilage de la cloison</li><li>Petites gouttières sur les bords pour les rameaux vasculo-nerveux de la muqueuse olfactive</li></ul></div></section><section class=\"sec\"><h3>Lame horizontale (lame criblée)</h3><div><ul><li>Dans la gouttière ethmoïdale du frontal ; plafond des fosses nasales ; divisée par la crista galli en 2 <b>gouttières olfactives</b> (bulbes olfactifs)</li><li>~25-30 orifices de chaque côté, sur 3 files, pour les <b>filets du nerf olfactif</b> (plus nombreux et plus petits sur la face inférieure)</li><li><b>Fente ethmoïdale</b> (interne, prolongement de la dure-mère) et <b>trou ethmoïdal antérieur</b> (externe : nerf nasal interne + artère ethmoïdale antérieure)</li><li>Quart postérieur : portion rétrobulbaire (bandelette olfactive)</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/005-2.jpg\" alt=\"Os ethmoïde — Mémento p. 14\"><figcaption>Os ethmoïde — Mémento p. 14</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 61-63. Images : Mémento Anatomia, Livre III.</p>"], "5": ["Os ethmoïde · labyrinthe", "<section class=\"sec\"><h3>Masses latérales</h3><div><ul><li>Entre fosses nasales (en dedans) et orbites (en dehors) ; presque cubiques : <b>6 faces</b></li><li><b>Externe</b> = <b>lame papyracée (os planum)</b> : paroi médiale de l’orbite ; s’articule avec frontal, maxillaire, lacrymal, sphénoïde et palatin</li><li><b>Supérieure</b> : semi-cellules → cellules fronto-ethmoïdales ; gouttières → canaux ethmoïdaux</li><li><b>Inférieure</b> : étroite ; cornet moyen, méat moyen, apophyse unciforme (→ cornet inférieur)</li><li><b>Antérieure</b> : semi-cellules → cellules lacrymo-ethmoïdales</li><li><b>Postérieure</b> : cavités complétées par le sphénoïde et le processus orbitaire du palatin</li></ul></div></section><section class=\"sec\"><h3>Face interne : cornets</h3><div><ul><li><b>Cornet supérieur</b> (de Morgagni) : ~25 mm ; limite le <b>méat supérieur</b> (cellules postérieures ; trou sphéno-palatin à son extrémité postérieure) ; parfois cornet suprême de Santorini</li><li><b>Cornet moyen</b> : triangulaire, ~45 × 10 mm ; limite la fente olfactive et le <b>méat moyen</b> ; <i>concha bullosa</i> si une cellule se développe dans la tête</li></ul></div></section><section class=\"sec\"><h3>Méat moyen</h3><div><ul><li><b>Apophyse unciforme</b> (lamellaire) et <b>bulle ethmoïdale</b> (arrondie)</li><li>Entre les deux : <b>gouttière unciforme (hiatus semi-lunaire)</b> ~20 mm : sinus frontal et cellules antérieures (antéro-supérieur), <b>sinus maxillaire</b> (postéro-inférieur)</li><li>Gouttière rétrobulbaire (10-12 mm) : quelques cellules antérieures</li></ul></div></section><section class=\"sec\"><h3>Cellules ethmoïdales</h3><div><ul><li>7-9 par côté ; ensemble = <b>labyrinthe ethmoïdal</b></li><li><b>Antérieures</b> : en avant du plan du canal ethmoïdal antérieur ; ne communiquent pas entre elles ; s’ouvrent dans le méat moyen (internes, gouttière unciforme, gouttière de la bulle)</li><li><b>Postérieures</b> : plus grosses, moins nombreuses ; communiquent entre elles ; s’ouvrent dans le méat supérieur</li><li>Anglo-saxons : antérieures (11), <b>moyennes</b> (3, gouttière de la bulle), postérieures (6)</li></ul></div></section><div class=\"tip\">Ossification : 3 centres (1 central dans la lame perpendiculaire, 1 dans chaque masse latérale, apparaissant aux mois 4-5).</div><figure><img loading=\"lazy\" src=\"images/005-2.jpg\" alt=\"Os ethmoïde — Mémento p. 14\"><figcaption>Os ethmoïde — Mémento p. 14</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 63-68. Images : Mémento Anatomia, Livre III.</p>"], "6": ["Os sphénoïde · corps", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Du grec « coin » ; os <b>médian, impair et symétrique</b>, à l’étage moyen de la base du crâne ; forme de bourdon ou de chauve-souris en vol</li><li>Éléments : <b>corps</b> (cubique), <b>petites ailes</b> (ailes orbitaires), <b>grandes ailes</b> (ailes temporales), <b>2 processus ptérygoïdes</b></li><li>Le corps a <b>6 faces</b> : supérieure, inférieure, antérieure, postérieure, 2 latérales</li></ul></div></section><section class=\"sec\"><h3>Face supérieure (cérébrale)</h3><div><ul><li>D’avant en arrière : <b>jugum sphénoïdal</b> (gouttières olfactives, rapport avec les canaux olfactifs), dont le bord antérieur porte la <b>crista cribrosa</b> (s’articule avec la crista galli) ; limité en arrière par le <b>limbe sphénoïdal</b></li><li><b>Gouttière optique (chiasmatique)</b> : chiasma optique ; aux extrémités, les <b>trous optiques</b> (nerf optique + artère ophtalmique)</li><li><b>Tubercule pituitaire</b>, puis <b>selle turcique</b> (fosse pituitaire) : glande hypophyse ; gouttière du sinus coronaire sur son versant antérieur, crête synostosique → <b>processus clinoïdes moyens</b></li><li>Selon les auteurs français, 4 <b>processus clinoïdes</b> (2 antérieurs, 2 postérieurs ; la tente du cervelet s’insère sur les postérieurs) ; parfois un processus moyen</li><li>En arrière : <b>lame quadrilatère (dorsum sellae)</b> ; gouttière supérieure : nerf <b>oculomoteur</b>, inférieure : nerf <b>abducens</b> ; en dessous, processus pierreux (pointe du rocher)</li></ul></div></section><section class=\"sec\"><h3>Face inférieure</h3><div><ul><li><b>Crête inférieure du sphénoïde</b> (schyndilèse sphéno-vomérienne avec le vomer) ; se réunit en avant à la crête antérieure → <b>bec du sphénoïde (rostrum)</b></li><li>De chaque côté : <i>concha sphénoïdalis</i>, qui délimite avec le processus sphénoïdal du palatin et le processus vaginal le <b>canal ptérygo-palatin</b> (nerf pharyngien de Bock)</li></ul></div></section><section class=\"sec\"><h3>Face antérieure</h3><div><ul><li><b>Crête sphénoïdale</b> médiane, articulée avec la lame perpendiculaire de l’ethmoïde</li><li>De chaque côté : gouttière participant à la paroi supérieure des fosses nasales et <b>orifice du sinus sphénoïdal</b></li><li>Dépression articulée avec la face postérieure des masses latérales de l’ethmoïde</li></ul></div></section><section class=\"sec\"><h3>Face postérieure et faces latérales</h3><div><ul><li><b>Postérieure</b> : rugueuse ; synchondrose occipito-sphénoïdale (soudée tôt) ; rapport avec la partie supérieure de la face antérieure du pont</li><li><b>Latérales</b> : articulées avec les grandes ailes et les processus ptérygoïdes ; <b>gouttière du sinus caverneux (carotidienne)</b> en « S » italique, plus profonde en arrière : sinus caverneux, <b>carotide interne</b>, nerfs oculomoteur, trochléaire, ophtalmique et abducens</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/006-1.jpg\" alt=\"Os sphénoïde, vues antérieure, inférieure et latérale — Mémento p. 19\"><figcaption>Os sphénoïde, vues antérieure, inférieure et latérale — Mémento p. 19</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 68-72. Images : Mémento Anatomia, Livre III.</p>"], "7": ["Os sphénoïde · petites ailes & ptérygoïdes", "<section class=\"sec\"><h3>Petites ailes</h3><div><ul><li>Triangulaires, base en dedans ; naissent de la partie <b>antéro-supérieure du corps</b></li><li><b>Face supérieure</b> lisse (lobe frontal) ; <b>face inférieure</b> : partie postérieure du plafond de l’orbite et <b>fente sphénoïdale</b></li><li><b>Bord postérieur</b> pointu, avec le <b>processus clinoïde antérieur</b> en dedans ; <b>sommet</b> : processus ensiforme (xiphoïde) ; <b>base</b> perforée par le <b>canal optique</b></li><li>Parfois processus clinoïdes antérieur et moyen réunis : orifice carotico-clinoïdien</li><li>Rouvière et Delmas : <b>2 racines</b> (supérieure mince, prolongeant le jugum ; postéro-inférieure) qui circonscrivent le <b>canal optique</b> (5 mm)</li></ul></div></section><section class=\"sec\"><h3>Processus ptérygoïdes</h3><div><ul><li>2 colonnettes verticales sous le corps, à la jonction avec les grandes ailes ; chacune : <b>base, 2 ailes (médiale et latérale), fosse ptérygoïde</b></li><li>Rouvière et Delmas : 2 racines (interne du corps, externe de la grande aile) qui circonscrivent le <b>canal ptérygoïdien (vidien)</b> : nerf et artère vidiens, du trou déchiré antérieur à la fosse ptérygo-maxillaire</li></ul></div></section><section class=\"sec\"><h3>Aile médiale</h3><div><ul><li>Quadrilatère, plus petite ; <b>face interne</b> : paroi latérale des fosses nasales et paroi externe des choanes ; <b>face externe</b> : limite la fosse ptérygoïde</li><li><b>Processus vaginal</b> (en haut) → canal ptérygo-palatin (artère ptérygo-palatine, nerf de Bock)</li><li><b>Fossette scaphoïde</b> : muscle péristaphylin externe ; bord postérieur : <b>constricteur supérieur du pharynx</b> ; <b>crochet du péristaphylin externe</b> (hamulus) en bas</li></ul></div></section><section class=\"sec\"><h3>Aile latérale</h3><div><ul><li>Plus volumineuse, inclinée en dehors ; <b>face interne</b> (fosse ptérygoïde) : muscle <b>ptérygoïdien médial</b> ; <b>face externe</b> : faisceau inférieur du <b>ptérygoïdien latéral</b></li><li>Bord antérieur uni à celui de l’aile médiale (limite en arrière la fissure ptérygo-maxillaire) ; bord postérieur : <b>épine de Civinini</b> (ligament ptérygo-épineux)</li><li>Le processus pyramidal du palatin s’insinue entre les 2 ailes et forme le fond de la fosse</li></ul></div></section><div class=\"tip\">Selon Waldeyer, 3 types de processus ptérygoïdes : <b>I</b> ailes presque égales (la latérale dépasse toujours) ; <b>II</b> fort développement de la latérale, surtout en bas ; <b>III</b> processus peu développés, surtout la lame interne.</div><figure><img loading=\"lazy\" src=\"images/007-1.jpg\" alt=\"Parties du sphénoïde et processus ptérygoïdes — Mémento p. 17\"><figcaption>Parties du sphénoïde et processus ptérygoïdes — Mémento p. 17</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 72-73, 77-79. Images : Mémento Anatomia, Livre III.</p>"], "8": ["Os sphénoïde · grandes ailes & sinus", "<section class=\"sec\"><h3>Grandes ailes</h3><div><ul><li>2 processus forts en <b>croissant de lune</b>, nés des faces latérales du corps ; <b>3 faces, 3 bords</b></li><li><b>Postéro-supérieure (cérébrale)</b> : concave, éminences mamillaires et empreintes digitales (lobe temporal) ; partie antérieure de l’étage moyen</li><li><b>Antérieure (orbitaire)</b> : paroi latérale de l’orbite ; s’articule avec le frontal (haut) et le zygomatique (côté) ; son bord inférieur forme avec le maxillaire la <b>fente sphéno-maxillaire</b> (nerf maxillaire, artère sous-orbitaire)</li><li><b>Externe (temporo-zygomatique)</b> : <b>crête sphéno-temporale (infra-temporale)</b> avec le <b>tubercule sphénoïdal</b> ; portion supérieure = fosse temporale (muscle temporal), inférieure = fosse zygomatique (faisceau supérieur du ptérygoïdien latéral)</li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Antérieur</b> : suture sphéno-malaire ; <b>externe</b> : dentelé, écaille du temporal</li><li><b>Interne</b> (base d’implantation), d’avant en arrière : <b>foramen rotundum</b> (nerf maxillaire) ; <b>foramen ovale</b> à ~1 cm en arrière et en dehors (nerf mandibulaire, petite méningée, veines émissaires) ; <b>foramen spinosum</b> (artère méningée moyenne, rameau méningé du mandibulaire)</li><li>Inconstants : orifice d’<b>Arnold</b> (petit nerf vidien) et orifice de <b>Vesalius</b> (veine émissaire du sinus caverneux)</li><li>Extrémité postérieure : <b>épine du sphénoïde</b> (ligament sphéno-mandibulaire, muscle du marteau, ligament ptérygo-épineux ; gouttière de la corde du tympan)</li><li>Anglo-saxons : bord pierreux (trou déchiré antérieur, synchondrose pétro-sphénoïdale) et bord squameux</li><li><b>Lingula</b> : borde en dehors la partie postérieure du sinus caverneux, divise partiellement le foramen lacerum</li></ul></div></section><section class=\"sec\"><h3>Fente sphénoïdale</h3><div><ul><li>Entre petite et grande aile, en virgule ; traversée par les nerfs <b>oculomoteur, trochléaire, ophtalmique, abducens</b>, la veine ophtalmique et une artériole de la méningée moyenne</li><li>Rouvière : gouttière pour l’<b>anneau de Zinn</b> et tubercule infra-optique</li></ul></div></section><section class=\"sec\"><h3>Sinus sphénoïdaux</h3><div><ul><li>2 cavités presque cubiques dans le corps, séparées par un <b>septum</b> souvent dévié ; <b>cornets de Bertin</b> : paroi antérieure et partiellement inférieure ; muqueuse continue avec la pituitaire</li><li><b>6 parois</b> : interne (septum) ; <b>externe</b> (sinus caverneux, carotide interne, nerfs III, IV, V1 ; canal optique, fente sphénoïdale) ; <b>supérieure</b> (selle turcique, hypophyse) ; <b>inférieure</b> (choanes, voûte du rhinopharynx) ; antérieure (masse latérale de l’ethmoïde, voûte des fosses nasales) ; l’orifice s’ouvre dans la <b>dépression sphéno-ethmoïdale</b></li></ul></div></section><div class=\"tip\">Ossification : 6 centres pré-sphénoïdaux et 8 post-sphénoïdaux. Petites ailes : 9e semaine ; grandes ailes : 8e semaine ; selle turcique : 4e mois ; 2 centres par processus ptérygoïde. À la naissance le corps n’est pas soudé à l’occipital ; fusion complète vers <b>25 ans</b>.</div><figure><img loading=\"lazy\" src=\"images/006-1.jpg\" alt=\"Os sphénoïde, vues antérieure, inférieure et latérale — Mémento p. 19\"><figcaption>Os sphénoïde, vues antérieure, inférieure et latérale — Mémento p. 19</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 73-77, 79-81. Images : Mémento Anatomia, Livre III.</p>"], "9": ["Partie pétreuse du temporal · faces endocrâniennes", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li><b>Rocher</b> à la base du crâne entre sphénoïde et occipital : <b>pyramide quadrilatère</b>, grand axe en haut, en avant et en dedans</li><li><b>4 faces</b> (2 endocrâniennes, 2 exocrâniennes), 4 bords, une base, un sommet</li><li>Anglo-saxons : temporal en 4 pièces (squameuse, pétro-mastoïdienne, tympanique, styloïdienne) ; fœtus de 8 mois : rocher, écaille, os tympanal</li></ul></div></section><section class=\"sec\"><h3>Face antéro-supérieure (cérébrale)</h3><div><ul><li>Orientée en haut et en avant, plus large en dehors ; rapport avec l’hémisphère cérébral</li><li><b>Empreinte trigéminale (fossette de Gasser)</b> en dedans : ganglion de Gasser du nerf trijumeau ; en dehors, plafond de la portion horizontale du <b>canal carotidien</b></li><li>Dépression latérale = partie du plafond du <b>méat auditif interne</b>, bordée en arrière par l’<b>eminentia arcuata</b> (canal semi-circulaire supérieur)</li><li><b>Tegmen tympani</b> : lamelle entre l’écaille et l’éminence arquée ; toit de l’antrum et de la caisse du tympan ; traversé par la <b>scissure pétro-squameuse supérieure</b></li><li>Entre fossette de Gasser et éminence arquée : <b>hiatus du canal du facial (Fallope)</b> (grand nerf pétreux superficiel, vers le trou déchiré antérieur) et <b>hiatus accessoires</b> (petit nerf pétreux superficiel, nerfs pétreux profonds)</li></ul></div></section><section class=\"sec\"><h3>Face postéro-supérieure (cérébelleuse)</h3><div><ul><li>Verticale, plus large en dehors ; rapport avec le cervelet</li><li>En dedans : <b>gouttière du sinus pétreux inférieur</b> → trou déchiré postérieur</li><li><b>Orifice auditif interne</b> (méat acoustique interne), à l’union du tiers interne et du tiers moyen : nerfs <b>facial, intermédiaire de Wrisberg, vestibulo-cochléaire</b> et artère auditive interne ; bordé en haut par la <b>crête supra-auditive</b> (repère de la racine sensitive du trijumeau)</li><li><b>Fossa subarcuata</b> à 5-6 mm au-dessus et en dehors (prolongement dure-mérien, vaisseaux ; orifice du canal pétro-mastoïdien)</li><li>À 10 mm en dehors : fente de l’<b>aqueduc du vestibule</b> (canal endolymphatique), parfois fossette unguéale</li><li>Partie la plus latérale : large <b>gouttière du sinus latéral</b> (portion verticale), vers le trou déchiré postérieur</li></ul></div></section><section class=\"sec\"><h3>Complément — nerf pétreux grand</h3><div><ul><li>Né du <b>ganglion géniculé</b> ; traverse le hiatus de la face antérieure du rocher, chemine dans un sillon sous le ganglion trigéminal vers le <b>foramen déchiré</b>, où il s’unit au <b>nerf pétreux profond</b> (plexus sympathique carotidien) → <b>nerf du canal ptérygoïdien (vidien)</b> → ganglion ptérygo-palatin</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/009-1.jpg\" alt=\"Os temporal droit, vues externe, inférieure et interne — Mémento p. 26\"><figcaption>Os temporal droit, vues externe, inférieure et interne — Mémento p. 26</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 82-84. Compléments : Recueil CM/TP Dr. Anca (Nerf facial, recueil p. 142). Images : Mémento Anatomia, Livre III.</p>"], "10": ["Partie pétreuse du temporal · faces exocrâniennes", "<section class=\"sec\"><h3>Face antéro-inférieure</h3><div><ul><li>Masquée en dehors par l’<b>os tympanal</b> sur le crâne articulé ; visible en dedans : <b>lit de la trompe d’Eustache</b> (portion cartilagineuse)</li><li>Dans l’angle écaille – bord antérieur du rocher : 2 canaux superposés, <b>canal du muscle du marteau</b> (haut) et <b>canal musculo-tubaire</b> (bas)</li><li>En avant : fossé qui forme avec la grande aile du sphénoïde le <b>canal du tube auditif</b></li></ul></div></section><section class=\"sec\"><h3>Face postéro-inférieure : zone externe</h3><div><ul><li><b>Processus mastoïde</b> conique : face externe (SCM, splénius de la tête, long de la tête) ; face interne : <b>incisure mastoïdienne</b> (ventre postérieur du digastrique) et gouttière de l’<b>artère occipitale</b>, séparées par l’éminence juxta-mastoïdienne</li><li>Base articulée avec le pariétal ; <b>trou mastoïdien</b> (branche de l’artère occipitale) ; <b>antrum mastoïdien</b> (cavité ~1 cm)</li><li><b>Processus styloïde</b> (~2,5 cm) : <b>bouquet de Riolan</b> (muscles stylo-hyoïdien, stylo-glosse, stylo-pharyngien ; ligaments stylo-hyoïdien et stylo-maxillaire) ; couvert par la parotide (carotide externe devant le sommet, nerf facial à la base)</li><li><b>Orifice stylo-mastoïdien</b> : sortie du <b>nerf facial</b>, entrée de l’artère stylo-mastoïdienne ; en avant : orifice pour la <b>corde du tympan</b></li><li><b>Facette jugulaire</b> (processus jugulaire de l’occipital)</li></ul></div></section><section class=\"sec\"><h3>Zone moyenne</h3><div><ul><li><b>Fosse jugulaire</b> : golfe de la veine jugulaire interne ; <b>canalicule mastoïdien</b> (rameau auriculaire de Cruveilhier, branche du vague)</li></ul></div></section><section class=\"sec\"><h3>Zone interne</h3><div><ul><li><b>Orifice inférieur du canal carotidien</b> (carotide interne), avec petit orifice du nerf carotico-tympanique</li><li>Sur la crête entre canal carotidien et fosse jugulaire : orifice du <b>canal tympanique</b> (nerf de Jacobson)</li><li><b>Fossette pétreuse (pyramidale)</b> : ganglion inférieur du glossopharyngien (ganglion d’Andersch) ; fond : aqueduc du limaçon</li><li>Surface rugueuse en avant et en dedans : insertion du <b>muscle élévateur du voile du palais</b> et articulation avec la portion basilaire de l’occipital</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/009-1.jpg\" alt=\"Os temporal droit, vues externe, inférieure et interne — Mémento p. 26\"><figcaption>Os temporal droit, vues externe, inférieure et interne — Mémento p. 26</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 84-87. Images : Mémento Anatomia, Livre III.</p>"], "11": ["Partie pétreuse du temporal · bords", "<section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Supérieur</b> (le plus long) : de dedans en dehors : gouttière du nerf <b>abducens</b>, dépression des racines du trijumeau, crête d’insertion de la <b>tente du cervelet</b>, gouttière du <b>sinus pétreux supérieur</b> ; se prolonge par la lèvre supérieure de la gouttière du sinus latéral</li><li><b>Inférieur</b> : entre faces antéro- et postéro-inférieures ; limite interne de la gouttière du tube auditif</li><li><b>Antérieur</b> : articulé avec l’écaille en dehors ; en dedans, limite le <b>trou déchiré antérieur</b> (~1 cm : nerf et artère vidiens), l’orifice supérieur du canal carotidien s’ouvre juste derrière</li><li><b>Postérieur</b> : surface rugueuse (portion basilaire de l’occipital, fibrocartilage), fossette pétreuse, <b>processus jugulaire</b> et <b>incisure jugulaire</b> du temporal → avec l’occipital : <b>trou jugulaire (déchiré postérieur)</b></li></ul></div></section><section class=\"sec\"><h3>Trou jugulaire</h3><div><ul><li>Le <b>ligament jugulaire</b> (en V) le divise en 3 compartiments : <b>antéro-interne</b> (sinus pétreux inférieur, glossopharyngien) ; <b>moyen</b> (vague, accessoire, artère méningée postérieure) ; <b>postéro-externe</b> (veine jugulaire interne)</li></ul></div></section><section class=\"sec\"><h3>Sommet et base</h3><div><ul><li><b>Sommet</b> : entre corps du sphénoïde, grande aile et processus basilaire ; orifice supérieur du canal carotidien ; limite postéro-latéralement le trou déchiré antérieur</li><li><b>Base</b> : partie postérieure de la région mastoïdienne (insertions du SCM, splénius, petit complexe)</li></ul></div></section><section class=\"sec\"><h3>Cavités du rocher</h3><div><ul><li><b>Oreille moyenne</b> : 6 parois (tegmen tympani, mastoïde, fosse jugulaire, canal carotidien, oreille interne, tympan dans le <b>sulcus tympanicus</b> ; segment de Rivinus)</li><li><b>Antrum mastoïdien</b> (1 cm, 6 parois) ; paroi externe = triangle sus-méatique, épaisseur 2 mm à la naissance, 12-15 mm chez l’adulte ; <b>aditus ad antrum</b> (~3 mm) ; cellules mastoïdiennes : pneumatiques 37 %, scléreuses 20 %, mixtes 43 %</li><li><b>Canal du facial (Fallope)</b> : labyrinthique (~0,5 cm, jusqu’au hiatus, genou), tympanique (1 cm), mastoïdien (10-15 mm) ; du méat auditif interne au trou stylo-mastoïdien</li><li><b>Canal carotidien</b> : portion verticale et horizontale, coude sous le limaçon</li></ul></div></section><section class=\"sec\"><h3>Complément — nerf facial dans le rocher</h3><div><ul><li><b>Segment méatal</b> : du méat acoustique interne ; le nerf pénètre dans le <b>canal facial</b>, dont la portion la plus étroite correspond au <b>foramen méatal</b></li><li><b>Segment labyrinthique</b> : au-dessus de l’axe de la pyramide pétreuse ; au <b>genou</b>, <b>ganglion géniculé</b> (en dedans de la pointe du processus trochléariforme)</li><li><b>Segment tympanique (horizontal)</b> : 10-12 mm, angle ~130° ; au-dessus de la fenêtre ovale, sous le canal semi-circulaire latéral</li><li><b>Segment pyramidal</b> : angle de 95° à 125° avec le précédent ; branche du <b>nerf du stapédien</b> ; la <b>corde du tympan</b> naît 3-5 mm au-dessus du foramen stylo-mastoïdien</li><li><b>Segment mastoïdien</b> : sortie par le foramen stylo-mastoïdien, à ~2 cm de profondeur par rapport au bord antérieur du processus mastoïde</li></ul><div class=\"tip\">Nomenclature : le recueil distingue 5 segments (méatal, labyrinthique, tympanique, pyramidal, mastoïdien) ; le Livre Dr. Anca en décrit 3 (labyrinthique, tympanique, mastoïdien).</div></div></section><figure><img loading=\"lazy\" src=\"images/009-1.jpg\" alt=\"Os temporal droit, vues externe, inférieure et interne — Mémento p. 26\"><figcaption>Os temporal droit, vues externe, inférieure et interne — Mémento p. 26</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 87-95. Compléments : Recueil CM/TP Dr. Anca (Nerf facial, recueil p. 140-141, 143). Images : Mémento Anatomia, Livre III.</p>"], "12": ["Partie squameuse du temporal", "<section class=\"sec\"><h3>Processus zygomatique</h3><div><ul><li>Apophyse puissante de la face externe de l’écaille ; la divise en 3 portions : <b>supérieure (verticale)</b>, <b>inférieure (horizontale)</b> et <b>rétroméatique</b></li><li><b>Base triangulaire</b> à 2 racines : <b>longitudinale</b> (ligne temporale inférieure, au-dessus du méat auditif externe) et <b>transversale = condyle du temporal (tubercule articulaire)</b></li><li><b>Sommet</b> tronqué, en biseau : s’articule avec l’os malaire (zygomatique)</li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Incisure pariétale</b> : sépare l’écaille de la région mastoïdienne</li><li>Coupé en biseau : <b>suture squameuse</b> avec le pariétal (haut et arrière) ; articulation avec la <b>grande aile du sphénoïde</b> (extrémité antéro-inférieure)</li><li>Fissures : <b>pétro-squameuse</b> (face endocrânienne) et <b>pétro-tympano-squameuse</b> (face exocrânienne), prolongée par la pétro-squameuse inférieure (prolongement inférieur du tegmen tympani)</li></ul></div></section><section class=\"sec\"><h3>Portion horizontale</h3><div><ul><li>Triangulaire (sommet interne, base externe) ; <b>face supérieure</b> (endocrânienne) = <b>tegmen tympani</b>, rapport avec l’hémisphère cérébral</li><li><b>Face inférieure</b> : <b>planum subtemporale</b> en avant, séparé par la <b>crête temporale (linea temporalis, supra-mastoïdienne)</b></li><li><b>Condyle du temporal</b> (semi-cylindrique, cartilagineux, articulation temporo-mandibulaire) ; en arrière <b>cavité glénoïde</b> (lisse, ovale), traversée par la <b>fissure pétro-tympano-squameuse</b> : champ antérieur articulaire (écaille), champ postérieur non articulaire</li><li>Parfois <b>tubercule post-glénoïdien</b> entre la cavité glénoïde et l’os tympanal</li></ul></div></section><section class=\"sec\"><h3>Portion rétroméatique et méat auditif externe</h3><div><ul><li>Postéro-supérieure au conduit, en avant de la mastoïde ; crête supérieure prolongeant la linea temporalis</li><li><b>Conduit auditif externe</b> : ~15-16 mm, elliptique ; parois antérieure et inférieure = <b>os tympanal</b>, supérieure et postérieure = écaille ; <b>sulcus tympanicus</b> (membrane du tympan) absent en haut : <b>segment de Rivinus</b></li><li><b>Épine supra-méatique de Henle</b> (repère de trépanation) ; en arrière, <b>zone perforée rétroméatique</b> en rapport avec l’antrum mastoïdien</li></ul></div></section><div class=\"tip\">Ossification : l’écaille naît d’<b>un seul centre</b>, près de la base du processus zygomatique (ossification membraneuse). Chez le nouveau-né, c’est une lame verticale aplatie, au-dessus et en dehors du rocher, unie à lui par la suture pétro-squameuse.</div><figure><img loading=\"lazy\" src=\"images/009-1.jpg\" alt=\"Os temporal droit, vues externe, inférieure et interne — Mémento p. 26\"><figcaption>Os temporal droit, vues externe, inférieure et interne — Mémento p. 26</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 95-97. Images : Mémento Anatomia, Livre III.</p>"], "13": ["Os tympanal", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Forme d’un <b>cercle incomplet</b> (cercle tympanal) ; <b>2 faces, 4 bords</b></li></ul></div></section><section class=\"sec\"><h3>Faces</h3><div><ul><li><b>Antérieure</b> : concave dans les deux sens ; forme la <b>fosse mandibulaire</b>, séparée de la cavité glénoïde de l’écaille par la <b>scissure de Glasser</b> ; rapport possible avec la <b>parotide</b> ; très mince au centre, parfois perforée</li><li><b>Postérieure</b> : limite avec l’écaille le <b>méat auditif externe</b>, qui présente au fond le <b>sulcus tympanicus</b></li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Supérieur</b> : écaille en dehors (scissure de Glasser), rocher en dedans</li><li><b>Inférieur</b> : variable ; en son milieu, <b>processus vaginal</b> qui couvre la base du processus styloïde</li><li><b>Externe</b> : rugueux, insertion du cartilage du conduit auditif externe</li><li><b>Interne</b> : limite avec le tegmen tympani l’<b>orifice externe de la trompe d’Eustache</b></li></ul></div></section><div class=\"tip\">Ossification : <b>1 centre</b>, membraneuse, apparaissant au <b>3e mois</b> intra-utérin. Chez le nouveau-né, anneau incomplet ouvert en haut, appliqué sur la face inféro-externe du rocher.</div><section class=\"sec\"><h3>Ossification du temporal</h3><div><ul><li><b>Rocher (pétro-mastoïdien)</b> : plusieurs centres dans la capsule otique, <b>5e mois</b>, par ossification de cartilage</li><li><b>Processus styloïde</b> (2e arc branchial) : 2 centres, proximal (avant la naissance) et distal (après)</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/013-1.jpg\" alt=\"Partie tympanique du temporal et méat acoustique externe — Mémento p. 27\"><figcaption>Partie tympanique du temporal et méat acoustique externe — Mémento p. 27</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 97-99. Images : Mémento Anatomia, Livre III.</p>"], "14": ["Os occipital · face exocrânienne", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Os <b>médian, impair, symétrique</b>, à la partie postérieure de la base et de la voûte ; repose sur l’<b>atlas</b></li><li>Concave en haut et en avant : <b>2 faces</b>, <b>4 bords</b> (2 supérieurs, 2 inférieurs), <b>4 angles</b></li><li>Le <b>trou occipital</b> (foramen magnum, ovalaire ~35 × 30 mm, presque horizontal : position bipède) laisse passer le bulbe rachidien, les racines spinales du XI et les artères vertébrales ; en avant : <b>surface basilaire</b>, en arrière : <b>écaille</b></li></ul></div></section><section class=\"sec\"><h3>Surface basilaire</h3><div><ul><li><b>Tubercule pharyngien</b> (à 1 cm du trou occipital, aponévrose pharyngienne), plus développé chez l’homme ; de chaque côté : muscles <b>droit antérieur de la tête</b> et <b>long de la tête</b> ; la membrane atlanto-occipitale s’insère sur le bord antérieur du trou</li><li>En avant : voûte du pharynx, <b>fossette naviculaire</b> (2/3 des cas) avec la <b>fossette pharyngienne</b> (poche de Luschka)</li><li>Soudée au corps du sphénoïde par la <b>synchondrose sphéno-occipitale</b>, ossifiée après 25 ans</li><li>Rouvière et Delmas : 2 crêtes courbes, <b>musculaire</b> (postérieure) et <b>synostosique de Poirier</b> (antérieure)</li></ul></div></section><section class=\"sec\"><h3>Écaille</h3><div><ul><li><b>Protubérance occipitale externe</b> : ligament cervical postérieur ; au-dessus, partie lisse (muscles occipitaux, aponévrose épicrânienne)</li><li><b>Lignes nucales suprêmes</b> (aponévrose épicrânienne) ; <b>lignes nucales supérieures</b> (occipital, trapèze, sterno-cléido-mastoïdien, splénius)</li><li><b>Crête occipitale externe</b> (ligament nuchal) ; <b>lignes nucales inférieures</b> : grand et petit droits postérieurs de la tête ; entre les lignes supérieure et inférieure : grand complexe et oblique supérieur de la tête</li></ul></div></section><section class=\"sec\"><h3>Condyles occipitaux</h3><div><ul><li>2 proéminences ovalaires de part et d’autre du trou occipital, articulées avec les cavités glénoïdes de l’<b>atlas</b> ; souvent 2 facettes (antérieure 1/3, postérieure 2/3)</li><li>Face interne : empreinte des <b>ligaments odontoïdiens latéraux</b> ; face externe : <b>surface jugulaire</b> (muscle droit latéral)</li><li><b>Trou condylien antérieur (canal de l’hypoglosse)</b> : nerf <b>XII</b> et parfois une artériole, souvent double ; <b>trou condylien postérieur</b> : veine et artériole</li><li>Points craniométriques sur la ligne médiane : <b>basion</b> (antérieur) et <b>opisthion</b> (postérieur)</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/014-1.jpg\" alt=\"Os occipital, vue externe — Mémento p. 22\"><figcaption>Os occipital, vue externe — Mémento p. 22</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 99-103. Images : Mémento Anatomia, Livre III.</p>"], "15": ["Os occipital · face endocrânienne", "<section class=\"sec\"><h3>Surface basilaire</h3><div><ul><li>Face concave en rapport avec l’encéphale ; <b>gouttière basilaire</b> médiane (protubérance annulaire, bulbe, tronc basilaire) ; sur les côtés : <b>gouttière du sinus pétreux inférieur</b></li></ul></div></section><section class=\"sec\"><h3>Écaille</h3><div><ul><li><b>Protubérance occipitale interne</b> : <b>pressoir d’Hérophile</b> (confluent veineux)</li><li><b>Gouttière sagittale</b> vers le haut (sinus sagittal supérieur ; faux du cerveau) ; <b>crête occipitale interne</b> vers le bas (faux du cervelet), qui se bifurque près du trou occipital ; <b>sinus occipital</b> souvent double ; <b>fossette vermienne</b> en bas</li><li><b>2 gouttières horizontales</b> (sinus latéraux, la droite souvent plus grande ; tente du cervelet) : avec la crête interne, elles forment <b>4 fosses occipitales</b></li><li><b>Fosses cérébrales</b> (supérieures, triangulaires, lobes occipitaux) et <b>fosses cérébelleuses</b> (inférieures, quadrilatères, hémisphères cérébelleux) ; trous condyliens de chaque côté du trou occipital</li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Supérieurs (lambdoïdes)</b> : dentelés ; <b>suture lambdoïde</b> avec les pariétaux ; os wormiens possibles</li><li><b>Inférieurs (mastoïdiens)</b> : <b>processus jugulaire</b> au milieu ; en arrière, mastoïde du temporal ; en avant, <b>gouttière jugulaire</b> → avec le rocher : <b>trou jugulaire</b>, divisé par le ligament jugulaire en 3 compartiments (antéro-interne : sinus pétreux inférieur et IX ; moyen : X, XI et artère méningée postérieure ; postéro-externe : confluence veineuse → veine jugulaire interne)</li></ul></div></section><section class=\"sec\"><h3>Angles</h3><div><ul><li><b>Supérieur</b> : pariétaux, <b>lambda</b> ; <b>inférieur</b> : tronqué, soudé au sphénoïde (synchondrose occipito-sphénoïdale) ; <b>latéraux</b> : obtus, dentelés, <b>astérion</b></li></ul></div></section><div class=\"tip\">Ossification : écaille au-dessus de la ligne nucale suprême : 2 centres membraneux (2e mois) ; au-dessous : 2 centres cartilagineux (7e semaine) ; parties condyliennes : 1 centre chacune (8e semaine) ; portion basilaire : 1 centre (6e semaine selon Gray).</div><figure><img loading=\"lazy\" src=\"images/014-1.jpg\" alt=\"Os occipital, vues interne et externe — Mémento p. 22\"><figcaption>Os occipital, vues interne et externe — Mémento p. 22</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 103-107. Images : Mémento Anatomia, Livre III.</p>"], "16": ["La voûte · partie exocrânienne", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Crâne : boîte ovoïde, capacité ~1400-1500 cm³ ; <b>voûte (calvarium)</b> au-dessus d’un plan de la <b>glabelle</b> à la <b>protubérance occipitale externe</b> (oblique de 22-25° sur l’horizontale), <b>base</b> au-dessous</li><li>Voûte : <b>frontal</b> (au-dessus de la glabelle), <b>2 pariétaux</b>, écaille occipitale au-dessus de la protubérance ; face externe = <b>exovoûte</b> (convexe, lisse)</li></ul></div></section><section class=\"sec\"><h3>Ligne médiane (d’avant en arrière)</h3><div><ul><li><b>Suture métopique</b> ; points <b>glabella</b> et <b>ophryon</b> (dépression sus-glabellaire)</li><li><b>Suture sagittale</b> : <b>bregma</b>, <b>obélion</b> (5 cm en avant du lambda)</li><li>Partie supérieure de l’écaille occipitale : <b>lambda</b> et <b>inion</b></li></ul></div></section><section class=\"sec\"><h3>Latéralement</h3><div><ul><li><b>Bosse frontale</b> et <b>bosse pariétale</b> ; sutures <b>coronale</b> et <b>lambdoïde</b></li><li><b>Crête temporale du frontal</b> et <b>lignes courbes temporales</b> du pariétal</li><li>Points craniométriques : <b>astérion, ptérion, stephanion</b></li></ul></div></section><section class=\"sec\"><h3>Fosse temporale (Rouvière et Delmas)</h3><div><ul><li>Limites : en haut, ligne courbe temporale supérieure du pariétal (prolongée par la ligne temporale du frontal) ; en bas, <b>arcade zygomatique</b> ; en avant, os zygomatique et processus orbitaire du frontal</li><li>Excavée en avant (os zygomatique), légèrement convexe en arrière</li><li>Formée par la partie verticale de l’<b>écaille du temporal</b>, la partie inférieure du <b>pariétal</b>, la face temporale de la <b>grande aile du sphénoïde</b> et la face temporale du <b>frontal</b> ; leurs sutures dessinent le <b>ptérion</b> en H ou en K</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/016-1.jpg\" alt=\"Calvaria, vues supérieure et inférieure — Mémento p. 29\"><figcaption>Calvaria, vues supérieure et inférieure — Mémento p. 29</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 107-109. Images : Mémento Anatomia, Livre III.</p>"], "17": ["La voûte · partie endocrânienne", "<section class=\"sec\"><h3>Endovoûte</h3><div><ul><li>Face interne de la voûte, <b>concave</b> ; moins marquée que la base par les empreintes des hémisphères</li></ul></div></section><section class=\"sec\"><h3>Ligne médiane (d’arrière en avant)</h3><div><ul><li><b>Crête frontale</b> (faux du cerveau)</li><li><b>Gouttière longitudinale</b> du sinus sagittal supérieur, de plus en plus large en arrière jusqu’à la protubérance occipitale interne (souvent plus marquée à droite)</li></ul></div></section><section class=\"sec\"><h3>De chaque côté</h3><div><ul><li><b>Fovéoles granulaires</b> (granulations de Pacchioni), plus nombreuses près du bregma et avec l’âge</li><li><b>Trous pariétaux</b> (inconstants), à 3-5 cm en avant de la suture lambdoïde : veines émissaires de Santorini</li><li>Plus latéralement : <b>fosses frontales</b>, suture coronale, <b>fosses pariétales</b>, suture lambdoïde, face interne de l’écaille occipitale</li><li>Sur les pariétaux : ramifications de l’<b>artère méningée moyenne</b> « en feuille de figuier »</li></ul></div></section><section class=\"sec\"><h3>Complément — fontanelles et croissance</h3><div><ul><li>Os de la voûte = <b>os de membrane</b> (ossification directe du mésenchyme, sans stade cartilagineux)</li><li>Les <b>sutures fibreuses, molles</b> permettent la déformation de la voûte à l’accouchement et la croissance pendant l’enfance</li><li><b>6 grandes fontanelles</b> à la naissance, aux angles des os de la voûte ; la <b>postérieure</b> se ferme dans les 3 mois, la <b>supérieure</b> reste ouverte jusqu’à ~1 an et demi (sa palpation renseigne sur la pression intracrânienne)</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/016-1.jpg\" alt=\"Calvaria, vue inférieure (endovoûte) — Mémento p. 29\"><figcaption>Calvaria, vue inférieure (endovoûte) — Mémento p. 29</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 107-108. Compléments : Recueil CM/TP Dr. Anca (Cours 11, recueil p. 26). Images : Mémento Anatomia, Livre III.</p>"], "19": ["La base du crâne · partie endocrânienne", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li><b>Endobase</b> : plus haute en avant, de plus en plus profonde en arrière ; <b>3 étages</b> : antérieur, moyen, postérieur</li></ul></div></section><section class=\"sec\"><h3>Étage antérieur (fosse crânienne antérieure)</h3><div><ul><li>Limite postérieure : gouttière optique, processus clinoïdes antérieurs, bords postérieurs des petites ailes</li><li>Formé par les <b>portions orbitaires du frontal</b>, les <b>petites ailes</b>, la <b>lame criblée de l’ethmoïde</b> et la partie antérieure du corps du sphénoïde</li><li>Ligne médiane : crête frontale, <b>foramen cæcum</b>, <b>crista galli</b>, crista cribrosa, <b>jugum sphénoïdal</b>, limbe, gouttière optique</li><li>Latéralement : lame criblée (fente et trou ethmoïdaux), bosses orbitaires, suture fronto-ethmoïdale avec les canaux ethmoïdaux</li></ul></div></section><section class=\"sec\"><h3>Étage moyen (sphéno-temporal)</h3><div><ul><li>Plus profond et plus large ; limité en arrière par la lame quadrilatère et le bord supérieur du rocher</li><li>Ligne médiane : <b>selle turcique</b> (processus clinoïdes) ; sur les côtés : <b>gouttière du sinus caverneux</b></li><li><b>Fente sphénoïdale</b>, puis d’avant en arrière : <b>foramen rotundum, ovale, épineux</b>, orifices de Vesalius et d’Arnold</li><li>Rocher : fossette de Gasser, hiatus de Fallope et accessoires, éminence arquée ; sommet : orifice du <b>canal carotidien</b> ; <b>trou déchiré antérieur</b> entre rocher, grande aile et corps du sphénoïde</li></ul></div></section><section class=\"sec\"><h3>Étage postérieur (occipito-temporal)</h3><div><ul><li>Limité par le <b>dorsum sellae</b>, les bords supérieurs des rochers et les gouttières des sinus transverses ; formé par la lame quadrilatère, la <b>portion basilaire</b> de l’occipital, les fosses cérébelleuses et la face postéro-supérieure du rocher</li><li>Ligne médiane : <b>gouttière basilaire, clivus, trou occipital, crête occipitale interne, protubérance occipitale interne</b></li><li>Rocher : gouttière du sinus pétreux supérieur, racines du trijumeau ; face postéro-supérieure : gouttière du sinus pétreux inférieur, <b>conduit auditif interne</b>, fossette sous-arquée, fossette unguéale, gouttière du sinus latéral (trou mastoïdien, canal condylien)</li><li>Occipital : trous condyliens ; entre occipital et rocher : <b>trou déchiré postérieur</b></li></ul></div></section><figure><img loading=\"lazy\" src=\"images/019-1.jpg\" alt=\"Base du crâne, vue endocrânienne avec ses foramens — Mémento p. 35\"><figcaption>Base du crâne, vue endocrânienne avec ses foramens — Mémento p. 35</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 109-112. Images : Mémento Anatomia, Livre III.</p>"], "18": ["La base du crâne · partie exocrânienne", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li><b>Exobase</b> : sous le plan voûte/base ; divisée par 2 plans transversaux fictifs : <b>bizygomatique</b> (tubercules zygomatiques) et <b>bimastoïdien</b> (processus mastoïdes)</li><li>3 zones : <b>antérieure (faciale)</b>, <b>moyenne (jugulaire)</b> entre les 2 plans, <b>postérieure (occipitale)</b></li><li>Rouvière et Delmas : 2 segments, <b>antérieur (facial)</b> et <b>postérieur (temporo-occipital)</b></li></ul></div></section><section class=\"sec\"><h3>Zone moyenne (jugulaire)</h3><div><ul><li>Ligne médiane : <b>surface basilaire de l’occipital</b> avec tous ses éléments</li><li>De part et d’autre, 4 proéminences formant un <b>quadrilatère</b> : en avant le <b>tubercule zygomatique</b> et le <b>processus ptérygoïde</b>, en arrière le <b>processus mastoïde</b> et le <b>condyle occipital</b></li><li>La diagonale (du bord postérieur du processus mastoïde à l’aile interne du processus ptérygoïde, traversant la suture pétro-occipitale et le foramen jugulaire) donne 2 triangles</li></ul></div></section><section class=\"sec\"><h3>Les deux triangles</h3><div><ul><li><b>Antéro-externe (temporal)</b> : orifice du <b>conduit auditif externe</b>, <b>cavité glénoïde</b> du temporal, <b>petit trou rond</b> (foramen spinosum) et <b>trou ovale</b></li><li><b>Postéro-interne (occipital)</b> : <b>trou stylo-mastoïdien</b>, trou déchiré postérieur, <b>orifice inférieur du canal carotidien</b>, fossette pétreuse, orifice exocrânien de la <b>trompe d’Eustache</b>, trou condylien antérieur, trou déchiré antérieur, <b>canal vidien</b></li></ul></div></section><section class=\"sec\"><h3>Zone postérieure (occipitale)</h3><div><ul><li>Limitée en avant par la <b>ligne bimastoïdienne</b></li><li>Ligne médiane, d’avant en arrière : <b>trou occipital, crête occipitale externe, protubérance occipitale externe</b></li><li>De chaque côté : <b>condyles occipitaux</b>, trous condyliens postérieurs, <b>processus jugulaires</b> ; sur l’écaille : lignes nucales supérieures et inférieures avec leurs insertions musculaires</li></ul></div></section><figure><img loading=\"lazy\" src=\"images/018-1.jpg\" alt=\"Base du crâne, vue exocrânienne et insertions — Mémento p. 32\"><figcaption>Base du crâne, vue exocrânienne et insertions — Mémento p. 32</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 112-114. Images : Mémento Anatomia, Livre III.</p>"], "20": ["Os maxillaire · faces", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Os le plus important de la <b>mâchoire supérieure</b>, au-dessus de la cavité buccale, sous l’orbite, en dehors des fosses nasales ; participe à l’orbite, aux fosses nasales, à la fosse ptérygo-maxillaire et infra-temporale</li><li>Un <b>corps</b> et <b>4 processus</b> : palatin, frontal (apophyse montante), alvéolaire, zygomatique (pyramidal) ; Testut décrit le processus alvéolaire comme le bord inférieur du corps</li><li>Auteurs français : le corps a <b>2 faces</b>, externe et interne</li></ul></div></section><section class=\"sec\"><h3>Face interne : processus palatin</h3><div><ul><li>À l’union des 3/4 supérieurs et du 1/4 inférieur ; forme la majorité du <b>plancher nasal</b> ; quadrilatère aplati, <b>2 faces et 4 bords</b></li><li><b>Face supérieure</b> lisse, concave (plancher nasal) ; <b>face inférieure</b> rugueuse (avec le processus opposé : 3/4 antérieurs du palais dur) ; orifices vasculaires, glandes palatines, gouttière de l’<b>artère palatine descendante</b> et du <b>nerf palatin antérieur</b></li><li><b>Bord interne</b> : <b>suture palatine médiane</b> ; en avant, semi-épine → <b>épine nasale antérieure</b> ; derrière : gouttière → <b>canal incisif</b> (1 cm) : branche interne de l’artère sphéno-palatine et <b>nerf sphéno-palatin interne de Hirschfeld</b> (parfois 2 canaux)</li><li><b>Suture incisive</b> (entre incisive latérale et canine), os incisif ; <b>crête nasale</b> au-dessus ; parfois <b>torus palatin</b></li><li>Bord postérieur mince, biseauté, uni à la lame horizontale du palatin ; bord antérieur : orifice antérieur des fosses nasales</li></ul></div></section><section class=\"sec\"><h3>Face interne : au-dessus et au-dessous</h3><div><ul><li>Sous le processus palatin : voûte palatine, rugueuse</li><li>Au-dessus : paroi des fosses nasales ; <b>hiatus du sinus maxillaire</b> (triangulaire, base en haut), réduit par le lacrymal, la lame verticale du palatin, l’ethmoïde et le cornet inférieur</li><li>En arrière : surface rugueuse (lame verticale du palatin) avec la <b>fissure palatine</b> → <b>canal palatin postérieur (grand canal palatin)</b> : artère palatine descendante et nerf palatin antérieur</li><li>En avant : <b>gouttière lacrymale</b> (nasale de Testut) → avec le lacrymal et le cornet inférieur : <b>canal lacrymo-nasal</b> (méat inférieur) ; <b>concha lacrymalis</b></li><li>Sur la face interne du processus frontal : <b>crête ethmoïdale</b> (cornet moyen) et <b>crête conchale</b> (cornet inférieur) ; entre les deux, l’<b>atrium</b> (méat moyen) ; au-dessus du hiatus : cellules ethmoïdo-maxillaires</li></ul></div></section><section class=\"sec\"><h3>Face externe</h3><div><ul><li><b>Fossette myrtiforme (incisive)</b> au-dessus des incisives : muscle myrtiforme ; plus haut, muscle nasal ; <b>buccinateur</b> au-dessus du bord inférieur</li><li><b>Bosse canine</b> (racine de la canine) ; <b>fosse canine</b> derrière : muscle <b>canin</b> (élévateur de l’angle de la bouche)</li></ul></div></section><section class=\"sec\"><h3>Processus pyramidal (zygomatique)</h3><div><ul><li>Pyramide triangulaire tronquée : <b>base</b> interne ; <b>sommet</b> dentelé articulé avec l’os malaire</li><li><b>Face supérieure (orbitaire)</b> : plancher de l’orbite ; <b>gouttière puis canal sous-orbitaire</b> (nerf maxillaire, artère sous-orbitaire) ; collatérale : nerf et vaisseaux alvéolaires supérieurs antérieurs</li><li><b>Face antérieure (génienne)</b> : <b>trou sous-orbitaire</b> à 5-8 mm sous le rebord orbitaire et 3 cm de la ligne médiane (sur la verticale de l’incisure supra-orbitaire) ; le nerf est en dehors des vaisseaux</li><li><b>Face postérieure (zygomatique)</b> : fosse zygomatique ; nerfs alvéolaires postérieurs et branches de l’artère alvéolo-antrale</li><li><b>Bords</b> : inférieur (vers la 1re molaire) ; postérieur (<b>fente sphéno-maxillaire</b>, <b>épine malaire</b>) ; antérieur (tiers interne du rebord orbitaire inférieur)</li></ul></div></section><section class=\"sec\"><h3>Complément — TP 18</h3><div><ul><li>Os <b>volumineux mais léger</b> : le sinus occupe les <b>2/3 supérieurs</b> de son épaisseur</li><li><b>Foramen infra-orbitaire</b> : 5-6 mm sous le rebord orbitaire inférieur, à 3 cm de la ligne médiane</li><li><b>Fossette myrtiforme</b> : muscle <b>abaisseur du septum nasal</b> ; <b>fosse canine</b> : muscle releveur de l’angle de la bouche</li><li><b>Tubérosité maxillaire</b> : 2-3 orifices de <b>canaux alvéolaires</b> (vaisseaux et nerfs dentaires postérieurs)</li><li><b>Processus palatin</b> : lame triangulaire, 2 faces et 3 bords ; <b>suture intermaxillaire</b> sur la face inférieure ; <b>foramen incisif</b> à son extrémité antérieure → canal incisif court, bifurqué en 2 canaux qui s’ouvrent dans les fosses nasales (nerfs et vaisseaux <b>naso-palatins</b>) ; crête nasale, <b>épine nasale antérieure</b> en saillie triangulaire</li><li><b>Sillon lacrymal</b> à 2 lèvres devant l’orifice du sinus : la lèvre antérieure prolonge le bord postérieur du processus frontal, et de son extrémité inférieure part la <b>crête conchale</b> ; il forme avec le sillon du lacrymal le <b>conduit lacrymo-nasal</b></li><li>Gouttière oblique en arrière de l’orifice du sinus, fermée par le palatin → <b>canal grand palatin</b></li></ul><div class=\"tip\">Divergence : le TP 18 décrit le processus palatin comme triangulaire (3 bords) ; le Livre Dr. Anca le décrit comme quadrilatère (4 bords).</div></div></section><figure><img loading=\"lazy\" src=\"images/020-1.jpg\" alt=\"Maxillaire, face nasale et vue antéro-latérale — Mémento p. 38\"><figcaption>Maxillaire, face nasale et vue antéro-latérale — Mémento p. 38</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 116-123. Compléments : Recueil CM/TP Dr. Anca (TP 18, recueil p. 154-155). Images : Mémento Anatomia, Livre III.</p>"], "21": ["Os maxillaire · bords & sinus", "<section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Antérieur</b> : de bas en haut, épine nasale antérieure et articulation inter-maxillaire, puis <b>incisure nasale</b> (avec l’os opposé : <b>ouverture piriforme</b>), puis bord du processus frontal</li><li><b>Postérieur</b> : <b>tubérosité maxillaire</b> (épaisse, plus marquée chez l’enfant) ; lisse en haut (paroi antérieure de la <b>fosse ptérygo-maxillaire</b>), rugueuse en bas (palatin, gouttière du canal palatin postérieur) ; <b>trigone palatin</b> ; gouttière du nerf maxillaire</li><li><b>Supérieur</b> : mince, irrégulier ; lacrymal, <b>os planum</b>, processus orbitaire du palatin ; semi-cellules possibles</li><li><b>Inférieur (processus alvéolaire)</b> : arqué, plus large en arrière ; alvéoles séparées par des septums, profondes de 15-20 mm ; molaires : 3 logettes radiculaires</li></ul></div></section><section class=\"sec\"><h3>Processus frontal</h3><div><ul><li>Naît de la partie latéro-supérieure, plus large en bas ; <b>sommet</b> articulé avec le processus orbitaire interne du frontal</li><li><b>Face externe</b> : <b>crête lacrymale antérieure</b> (ligament palpébral interne), gouttière qui complète celle du lacrymal : <b>fossette du sac lacrymal</b> ; devant la crête : orbiculaire des paupières et élévateur de la lèvre supérieure et de l’aile du nez</li><li><b>Face interne</b> : rugosités (labyrinthes ethmoïdaux), crête ethmoïdale ; <b>bord antérieur</b> : os nasaux ; <b>bord postérieur</b> : lacrymal</li></ul></div></section><section class=\"sec\"><h3>Sinus maxillaire (antre de Highmore)</h3><div><ul><li>Cavité de ~15 cm³ ; pyramide à base médiane (nasale) et sommet latéral ; <b>5 parois, 4 bords</b></li><li><b>Antérieure (jugale)</b> : ~1 mm ; abord chirurgical (<b>fosse canine</b> = trépanation, trou sous-orbitaire à protéger) ; canalicules des nerfs dentaires antéro-supérieur et moyen ; canal de Parinaud (inconstant)</li><li><b>Supérieure (orbitaire)</b> : plancher de l’orbite ; canal sous-orbitaire en saillie, parfois déhiscent</li><li><b>Postérieure</b> : tubérosité (fosse ptérygo-maxillaire) ; nerfs dentaires postérieurs et canal palatin postérieur</li><li><b>Inférieure</b> : en gouttière, ~1,25 cm sous le plancher nasal ; racines de la 2e prémolaire et des 2 premières molaires → <b>sinusites odontogènes</b></li><li><b>Interne (nasale, base)</b> : le bord supérieur du cornet inférieur la divise en triangle antéro-inférieur (méat inférieur) et postéro-supérieur (méat moyen) ; zone fine pour la <b>ponction</b> ; canal lacrymo-nasal ; ostium, orifices accessoires de Giraldès</li><li>Muqueuse respiratoire ; cloisons incomplètes fréquentes</li></ul></div></section><div class=\"tip\">Ossification : 3 centres — masse principale (au-dessus de la fosse canine, <b>6e semaine</b>) et 2 centres prémaxillaires dans l’<b>os incisif</b> (<b>7e semaine</b>).</div><section class=\"sec\"><h3>Complément — TP 18</h3><div><ul><li><b>Bord supérieur</b> : lacrymal et lame orbitaire de l’ethmoïde ; <b>bord antérieur</b> échancré (orifice antérieur des fosses nasales) ; <b>bord postérieur</b> épais, presque vertical (tubérosité), rugueux à ses 2 extrémités</li><li><b>Sinus : 4 parois + base + sommet</b> ; <b>supérieure</b> (saillie du canal infra-orbitaire) ; <b>antérieure</b> convexe, très mince, avec le canal alvéolaire ; <b>postérieure et inférieure</b> : fosse infra-temporale, rameaux alvéolaires supérieurs postérieurs</li><li><b>Base</b> en 2 segments (méat inférieur, méat moyen) : zone mince = processus maxillaire du cornet inférieur + processus maxillaire du palatin ; segment supérieur = ostium, avec zones simplement muqueuses en avant et en arrière (orifices accessoires possibles) ; le conduit lacrymo-nasal fait une saillie demi-cylindrique</li><li><b>Sommet</b> : souvent prolongé dans l’os zygomatique ; <b>bord antérieur</b> : rigole verticale profonde ; <b>bord inférieur</b> : gouttière sous le plancher nasal, en rapport avec les prémolaires et les 2 premières molaires (racines souvent saillantes) ; angle supéro-postérieur : processus orbitaire du palatin</li></ul><div class=\"tip\">Divergence : le TP 18 décrit 4 parois + base + sommet, le Livre Dr. Anca 5 parois et 4 bords. Le TP situe sur la paroi antérieure le relief d’un « canal supra-orbitaire » (terme tel qu’écrit dans le recueil).</div></div></section><figure><img loading=\"lazy\" src=\"images/020-1.jpg\" alt=\"Maxillaire, face nasale et vue antéro-latérale — Mémento p. 38\"><figcaption>Maxillaire, face nasale et vue antéro-latérale — Mémento p. 38</figcaption></figure><p class=\"src\">Source du texte : <b>Livre Dr. Anca</b>, p. 123-129. Compléments : Recueil CM/TP Dr. Anca (TP 18, recueil p. 156-157). Images : Mémento Anatomia, Livre III.</p>"], "22": ["Os lacrymal (unguis)", "<section class=\"sec\"><h3>Généralités</h3><div><ul><li>Lamelle osseuse <b>petite et fragile</b>, aplatie de dehors en dedans, à la partie antérieure de la paroi médiale de l’<b>orbite</b>, juste derrière le processus frontal du maxillaire</li><li>Délimite avec le maxillaire et le cornet nasal inférieur le <b>canal lacrymo-nasal</b></li><li><b>2 faces</b> et <b>4 bords</b></li></ul></div></section><section class=\"sec\"><h3>Face latérale (orbitaire)</h3><div><ul><li><b>Crête lacrymale postérieure</b> verticale : tendon réfléchi du muscle <b>orbiculaire des paupières</b> ; elle divise la face en 2 portions</li><li><b>Postérieure</b> : lisse, partie antérieure de la paroi médiale de l’orbite, dans la continuité de l’<b>os planum</b> de l’ethmoïde</li><li><b>Antérieure</b> : gouttière verticale qui complète en haut la <b>fossette du sac lacrymal</b> et forme en bas une partie du <b>conduit lacrymo-nasal</b> (orbite → fosse nasale, ouvert dans le <b>méat inférieur</b>)</li><li>L’os descend sous le bord supérieur du maxillaire : les 2 lèvres de la gouttière lacrymale s’articulent avec celles de la gouttière du maxillaire (canal moitié lacrymal, moitié maxillaire)</li><li><b>Hamulus lacrimalis</b> : petit crochet sous le plancher de l’orbite, au point où la crête lacrymale postérieure rencontre le bord supérieur du maxillaire ; articulé avec une épine du maxillaire, il ferme la gouttière (parfois os lacrymal inférieur séparé)</li></ul></div></section><section class=\"sec\"><h3>Face médiale (ethmoïdale)</h3><div><ul><li>Lisse en avant et en bas (muqueuse nasale) ; irrégulière en arrière et en haut : articulée avec les masses latérales de l’ethmoïde, elle complète des <b>cellules ethmoïdales antérieures</b></li><li>Dépression correspondant à la crête lacrymale ; paroi latérale des fosses nasales (région antéro-inférieure : méat moyen), en partie recouverte par l’ethmoïde</li></ul></div></section><section class=\"sec\"><h3>Bords</h3><div><ul><li><b>Supérieur</b> (le plus court) : processus orbitaire interne du frontal → <b>suture fronto-lacrymale</b></li><li><b>Inférieur</b> : processus lacrymal du cornet nasal inférieur et maxillaire ; en arrière de la gouttière, tangent à l’orifice du sinus maxillaire (qu’il réduit un peu)</li><li><b>Postérieur</b> : lame papyracée de l’ethmoïde → <b>suture ethmoïdo-lacrymale</b> ; selon Rouvière et Delmas, aussi avec la <b>concha lacrymalis</b> du maxillaire</li><li><b>Antérieur</b> : bord postérieur du processus frontal du maxillaire et lèvre antérieure de la gouttière lacrymale → <b>suture lacrymo-maxillaire</b></li></ul></div></section><div class=\"tip\">Ossification : <b>1 centre</b>, 12e semaine (3e mois) de la vie intra-utérine.</div><figure><im
